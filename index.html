<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>千禧时光机</title>
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M10 2l6 7 6-8' fill='none' stroke='%236b7690' stroke-width='2' stroke-linecap='round'/%3E%3Crect x='1' y='9' width='30' height='22' rx='5' fill='%23c9d2de'/%3E%3Crect x='4' y='12' width='19' height='16' rx='4' fill='%232f86ee'/%3E%3Ccircle cx='27' cy='17' r='2.2' fill='%23525d76'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Michroma&family=Noto+Sans+SC:wght@400;500;600;700&family=Share+Tech+Mono&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>/* 概念：千禧年的家用电器。默认是珍珠银机身、蓝光液晶和果冻按钮；Night 开关切到午夜包厢。
   装饰只放在框架和首屏，阅读区保持干净。 */
:root {
  color-scheme: light;
  --bg: #e4e9f0; --ink: #0c1328; --mute: #4a5672; --line: rgba(18, 30, 62, .17); --hair: rgba(18, 30, 62, .09);
  --accent: #0b5fd8; --on-accent: #ffffff; --hot: #c8127a;
  --plate: linear-gradient(180deg, rgba(255, 255, 255, .94), rgba(240, 244, 250, .8));
  --solid: #f4f7fb; --gloss: rgba(255, 255, 255, .95); --well: rgba(20, 34, 70, .055);
  --lcd: #b4e2fc; --lcd-b: #84caf3; --lcd-ink: #05203f; --lcd-line: rgba(0, 40, 90, .055);
  --steel: linear-gradient(180deg, #fdfeff 0%, #e6ebf2 46%, #d0d9e4 54%, #e9eef4 100%);
  --key: linear-gradient(180deg, #ffffff 0%, #eaeff4 50%, #d4dce6 100%);
  --shadow: rgba(24, 40, 80, .22); --hinge: #1a2036;
  --chrome: linear-gradient(180deg, #16223d 0%, #41567c 24%, #9fb4d0 44%, #e3edf8 49.5%, #0c1428 50.5%, #243455 62%, #5f7aa0 84%, #a9bfda 100%);
  --chrome-fx: drop-shadow(0 1px 0 rgba(255, 255, 255, .9)) drop-shadow(0 6px 9px rgba(30, 50, 90, .26));
  --chrome-edge: rgba(14, 24, 48, .42);
  --page:
    radial-gradient(1100px 620px at 88% -8%, rgba(150, 205, 255, .6), transparent 62%),
    radial-gradient(860px 560px at -6% 14%, rgba(240, 190, 255, .34), transparent 62%),
    radial-gradient(900px 640px at 62% 108%, rgba(180, 255, 232, .34), transparent 62%);
  --f-display: 'ZCOOL QingKe HuangYou', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --f-body: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --f-tech: 'Michroma', 'Eurostile', 'Bank Gothic', 'Noto Sans SC', sans-serif;
  --f-lcd: 'Share Tech Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --holo: linear-gradient(90deg, #86c6ff, #ffaee2, #fff09a, #9dffd9, #86c6ff);
  --spectrum: conic-gradient(from 18deg, #dfe6ee 0deg, #f7fafd 18deg, #ffd3ef 34deg, #fff3b0 44deg, #b4ffe4 54deg, #a5d2ff 64deg, #e6ebf3 82deg, #c8d2de 120deg, #eef2f7 172deg, #dfe6ee 180deg, #f7fafd 198deg, #ffd3ef 214deg, #fff3b0 224deg, #b4ffe4 234deg, #a5d2ff 244deg, #e6ebf3 262deg, #c8d2de 300deg, #eef2f7 352deg, #dfe6ee 360deg);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #05070f; --ink: #e9eefb; --mute: #9aa6c2; --line: rgba(200, 215, 255, .17); --hair: rgba(200, 215, 255, .09);
  --accent: #80c9ff; --on-accent: #04122c; --hot: #ff86cc;
  --plate: linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .03));
  --solid: #111624; --gloss: rgba(255, 255, 255, .13); --well: rgba(255, 255, 255, .055);
  --lcd: #08243f; --lcd-b: #0b3a60; --lcd-ink: #93e2ff; --lcd-line: rgba(130, 220, 255, .05);
  --steel: linear-gradient(180deg, #2c3346 0%, #1c2131 46%, #131722 54%, #1d2232 100%);
  --key: linear-gradient(180deg, #2e3549 0%, #1f2535 50%, #161a27 100%);
  --shadow: rgba(0, 0, 0, .62); --hinge: #05070f;
  --chrome: linear-gradient(180deg, #ffffff 0%, #d6e3f3 28%, #8ea4c5 47%, #eaf3ff 49.5%, #1f2a48 50.5%, #6f8cb6 62%, #dcecff 84%, #ffffff 100%);
  --chrome-fx: drop-shadow(0 2px 14px rgba(120, 190, 255, .28));
  --chrome-edge: rgba(255, 255, 255, .2);
  --page:
    radial-gradient(1100px 620px at 88% -8%, rgba(46, 96, 190, .42), transparent 62%),
    radial-gradient(860px 560px at -6% 14%, rgba(130, 50, 170, .24), transparent 62%),
    radial-gradient(900px 640px at 62% 108%, rgba(20, 130, 130, .2), transparent 62%);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; background: var(--bg); }
body { margin: 0; color: var(--ink); background: var(--page), var(--bg); background-attachment: fixed; font: 400 15px/1.75 var(--f-body); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--solid); }
::selection { background: #8fd0ff; color: #05203f; }
a { color: var(--accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: .01em; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.tech { font-family: var(--f-tech); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
.lcdnum { font-family: var(--f-lcd); font-variant-numeric: tabular-nums; }
#view { overflow-x: clip; }
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.more { color: var(--accent); font-size: 14px; }

/* 共用材质 */
.card, .ycard, .era-c, .ed-mini, .filters, .shuffle, .box, .scroll, .now-head, .fold, .whole { background: var(--plate); border: 1px solid var(--line); box-shadow: inset 0 1px 0 var(--gloss), 0 12px 28px -22px var(--shadow); }
.lcd { position: relative; background: repeating-linear-gradient(0deg, var(--lcd-line) 0 1px, transparent 1px 3px), linear-gradient(180deg, var(--lcd), var(--lcd-b)); color: var(--lcd-ink); border-radius: 6px; padding: 10px 14px; box-shadow: inset 0 1px 4px rgba(4, 30, 70, .34), inset 0 0 0 1px rgba(4, 30, 70, .16), 0 1px 0 var(--gloss); font-family: var(--f-lcd); }

/* 机身导航 */
.deck { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--steel); border-bottom: 1px solid rgba(10, 20, 44, .28); box-shadow: inset 0 1px 0 var(--gloss), 0 4px 14px -6px var(--shadow); }
.deck-in { display: flex; align-items: center; gap: 16px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); flex: none; }
.brand-tv { width: 30px; height: 30px; flex: none; color: var(--mute); filter: drop-shadow(0 1px 1px var(--shadow)); }
.brand b { font: 400 19px/1 var(--f-display); white-space: nowrap; }
.nav { display: flex; gap: 1px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a[hidden] { display: none; }
.nav a { padding: 4px 11px; border-radius: 999px; color: var(--ink); text-decoration: none; font-size: 14px; white-space: nowrap; border: 1px solid transparent; }
.nav a:hover { background: var(--well); }
.nav a[aria-current="page"] { color: #fff; text-shadow: 0 -1px 0 rgba(0, 40, 120, .5); background: linear-gradient(180deg, #a9dcff 0%, #3a97f4 48%, #1270e2 52%, #4fb0ff 100%); border-color: #0d57c4; box-shadow: inset 0 1px 1px rgba(255, 255, 255, .8), 0 1px 2px rgba(0, 40, 120, .4); }
.search { position: relative; flex: 0 1 230px; min-width: 150px; }
.search input { width: 100%; padding: 5px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--well); box-shadow: inset 0 1px 3px rgba(10, 20, 44, .18); outline-offset: 0; }
.results { position: absolute; right: 0; top: calc(100% + 7px); width: min(420px, calc(100vw - 32px)); max-height: 66vh; overflow: auto; background: var(--solid); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 14px 34px var(--shadow); padding: 5px; }
.results a { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 6px 8px; border-radius: 7px; color: var(--ink); text-decoration: none; line-height: 1.35; }
.results a:hover, .results a.on { background: var(--well); }
.results small { color: var(--mute); display: block; font-size: 12px; }
.results .none { padding: 12px; color: var(--mute); }
/* 机身侧面的拨动开关 */
.hold { display: inline-flex; align-items: center; gap: 7px; padding: 0; border: 0; background: none; cursor: pointer; flex: none; }
.hold span { font: 400 8.5px/1 var(--f-tech); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.hold i { position: relative; display: block; width: 34px; height: 18px; border-radius: 4px; background: var(--well); box-shadow: inset 0 1px 3px rgba(10, 20, 44, .34), 0 1px 0 var(--gloss); }
.hold i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 15px; height: 14px; border-radius: 3px; background: repeating-linear-gradient(90deg, rgba(10, 20, 44, .28) 0 1px, transparent 1px 3px), var(--key); box-shadow: 0 1px 2px var(--shadow); transition: transform .14s ease; }
.hold[aria-pressed="true"] i::after { transform: translateX(15px); background: repeating-linear-gradient(90deg, rgba(0, 0, 0, .3) 0 1px, transparent 1px 3px), linear-gradient(180deg, #a9dcff, #1270e2); }

/* 首屏：一台调台旋钮刻着年份的老电视 */
.player { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 44px; align-items: center; padding-block: 44px 36px; }
.spec { display: flex; align-items: center; gap: 14px; margin: 0 0 16px; }
.barcode { width: 92px; height: 18px; fill: var(--ink); opacity: .8; margin-left: auto; }
.player h1 { position: relative; width: fit-content; font-size: clamp(64px, 10.5vw, 144px); line-height: 1.04; }
.player h1::after, .glint { content: ""; position: absolute; left: 100%; top: 34%; width: .46em; height: .46em; margin-left: .1em; background: var(--accent); clip-path: path('M26 0Q26 26 52 26Q26 26 26 52Q26 26 0 26Q26 26 26 0Z'); transform-origin: 0 0; }
.player h1 span, .page-h > h1 { background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; filter: var(--chrome-fx); -webkit-text-stroke: .6px var(--chrome-edge); }
.player h1 span { display: block; width: fit-content; padding-right: .04em; }
.player .lede { max-width: 33em; margin: 18px 0 0; font-size: 16px; line-height: 1.8; }
.counts { display: flex; flex-wrap: wrap; gap: 6px 26px; margin-top: 20px; width: fit-content; }
.counts div { display: flex; align-items: baseline; gap: 6px; }
.counts b { font-weight: 400; font-size: 25px; line-height: 1; }
.counts span { font-family: var(--f-body); font-size: 12.5px; }
.hero-play { margin-top: 16px; }

.tv { position: relative; margin: 74px 0 26px; min-width: 0; }
.tv-ant { position: absolute; left: 32%; bottom: calc(100% - 8px); width: 36%; height: auto; fill: #8d97a8; stroke: #8d97a8; stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 2px 2px var(--shadow)); }
.tv-case { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 20px; padding: 22px 18px 22px 24px; border-radius: 28px; background: linear-gradient(162deg, #f7f9fc 0%, #dfe5ed 36%, #bfc8d5 74%, #d3dae4 100%); box-shadow: inset 0 2px 1px rgba(255, 255, 255, .95), inset 0 -4px 8px rgba(40, 55, 85, .3), 0 0 0 1px rgba(10, 20, 44, .24), 0 38px 44px -28px rgba(24, 40, 80, .6); }
.tv::after { content: ""; position: absolute; left: 14%; right: 14%; bottom: -13px; height: 14px; border-radius: 0 0 16px 16px; background: linear-gradient(180deg, #8d97a8, #b4bdca); box-shadow: 0 8px 12px -6px var(--shadow); }
:root[data-theme="dark"] .tv-case { background: linear-gradient(162deg, #454d62 0%, #2c3244 40%, #1b1f2d 78%, #272c3c 100%); box-shadow: inset 0 2px 1px rgba(255, 255, 255, .22), inset 0 -4px 8px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .1), 0 38px 44px -28px #000; }
:root[data-theme="dark"] .tv::after { background: linear-gradient(180deg, #161a26, #2c3244); }
.tv-screen { position: relative; display: block; width: 100%; aspect-ratio: 4 / 3; padding: 0; border: 0; overflow: hidden; cursor: pointer; color: #fff; text-align: left; background: #05070f; border-radius: 38px / 30px; box-shadow: 0 0 0 9px #14171f, 0 0 0 11px rgba(255, 255, 255, .5); }
.tv-screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(1.12) contrast(1.04); }
.tv-screen::before { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .16) 0 1px, transparent 1px 3px); }
.tv-screen::after { content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none; border-radius: inherit; background: linear-gradient(118deg, rgba(255, 255, 255, .17) 0 21%, transparent 21.4%), radial-gradient(ellipse at center, transparent 54%, rgba(0, 0, 0, .46) 100%); box-shadow: inset 0 0 26px rgba(0, 0, 0, .55); }
#tv-snow { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; image-rendering: pixelated; }
#tv-snow[hidden] { display: none; }
.tv-osd { position: absolute; z-index: 2; left: 34px; right: 34px; top: 22px; display: flex; justify-content: space-between; align-items: baseline; font-family: var(--f-lcd); color: #7dff8e; text-shadow: 0 0 8px rgba(70, 255, 110, .75), 0 1px 0 #000; }
.tv-osd b { font-weight: 400; font-size: 21px; line-height: 1; }
.tv-osd b + b { font-size: 34px; }
.tv-third { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: 26px 0 15px; background: linear-gradient(180deg, transparent, rgba(4, 22, 74, .86) 34%, rgba(4, 22, 74, .94)); }
.tv-third b { display: block; padding: 0 34px 3px; font: 400 26px/1.15 var(--f-display); text-shadow: 0 2px 4px rgba(0, 0, 0, .5); }
.tv-roll { display: block; overflow: hidden; margin: 0 22px; font-size: 13px; line-height: 1.5; color: #d9e6ff; }
.tv-roll i { display: inline-block; font-style: normal; white-space: nowrap; padding-left: 100%; animation: tick var(--t, 40s) linear infinite; }
@keyframes tick { to { transform: translateX(-100%); } }
.tv-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tv-brand { margin: 0; font: 400 10.5px/1.4 var(--f-tech); letter-spacing: .1em; color: #2b3448; }
.tv-brand i { float: right; width: 8px; height: 8px; margin-top: 2px; border-radius: 50%; background: #47e66b; box-shadow: 0 0 7px #47e66b, inset 0 1px 1px rgba(255, 255, 255, .8); }
.tv-brand small { display: block; font-size: 7.5px; letter-spacing: .2em; color: #566179; }
.knob { position: relative; width: 100%; aspect-ratio: 1; flex: none; border-radius: 50%; cursor: grab; touch-action: none; --a: 0deg; }
.knob.held { cursor: grabbing; }
.knob svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.knob line { stroke: #4d5870; stroke-width: 1.3; }
.knob text { font: 400 11.5px/1 var(--f-lcd); fill: #2b3448; text-anchor: middle; dominant-baseline: central; transition: fill .12s; }
.knob text.on { fill: #d41c2e; font-size: 14px; }
.knob-cap { position: absolute; inset: 21%; border-radius: 50%; background: repeating-conic-gradient(#fdfeff 0deg 5deg, #8b95a7 5deg 10deg); box-shadow: 0 7px 12px -3px rgba(16, 26, 54, .6), 0 0 0 1px rgba(10, 20, 44, .4); transform: rotate(var(--a)); transition: transform .18s cubic-bezier(.3, 1.5, .6, 1); }
.knob-cap::before { content: ""; position: absolute; inset: 11%; border-radius: 50%; background: conic-gradient(from 20deg, #f7f9fc, #a9b3c3, #eef1f6, #98a3b5, #f7f9fc, #a9b3c3, #eef1f6, #98a3b5, #f7f9fc); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .9), 0 0 0 1px rgba(10, 20, 44, .25); }
.knob-cap::after { content: ""; position: absolute; left: 50%; top: 4%; width: 6px; height: 36%; margin-left: -3px; border-radius: 3px; background: #d41c2e; box-shadow: 0 0 0 1px rgba(255, 255, 255, .7); }
:root[data-theme="dark"] .tv-brand, :root[data-theme="dark"] .knob text { color: #dbe4f5; fill: #dbe4f5; }
:root[data-theme="dark"] .tv-brand small { color: #a4afc6; }
:root[data-theme="dark"] .knob line { stroke: #a4afc6; }
:root[data-theme="dark"] .knob text.on { fill: #ff7a86; }
.tv-keys { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tv-keys button { height: 30px; padding: 0; border: 1px solid rgba(10, 20, 44, .3); border-radius: 7px; font: 400 18px/1 var(--f-lcd); color: #1b2438; background: linear-gradient(180deg, #ffffff, #dde3ec 50%, #c4ccd8); box-shadow: inset 0 1px 0 #fff, 0 1px 2px var(--shadow); cursor: pointer; }
.tv-keys button:active { transform: translateY(1px); box-shadow: inset 0 1px 2px rgba(10, 20, 44, .3); }
.tv-grille { flex: 1; min-height: 14px; border-radius: 3px; background: repeating-linear-gradient(0deg, rgba(14, 22, 44, .62) 0 3px, transparent 3px 7px); }
/* 音乐页的抬头：一张光盘，光谱条纹由光线决定，所以盘面不动，只有印刷文字转 */
.music-h { position: relative; }
.music-h > h1, .music-h > p, .music-h > .counts { position: relative; z-index: 1; }
.music-h > p { max-width: 36em; }
.disc-box { position: absolute; right: 24px; top: 16px; width: 256px; aspect-ratio: 1; }
.disc-clip { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: var(--spectrum); box-shadow: 0 22px 40px -22px var(--shadow), 0 0 0 1px rgba(10, 20, 44, .22), inset 0 0 0 2px rgba(255, 255, 255, .7); }
.disc-clip::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: repeating-radial-gradient(circle, rgba(255, 255, 255, .1) 0 1px, rgba(40, 60, 100, .035) 1px 2px); }
.disc { position: absolute; inset: 0; border-radius: 50%; animation: spin 26s linear infinite; }
.disc svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.disc text { fill: #18233f; font-family: var(--f-tech); font-size: 5.8px; letter-spacing: .17em; }
.hub { position: absolute; inset: 34%; border-radius: 50%; background: radial-gradient(circle, var(--bg) 0 28%, #6f7c92 28.6% 29.4%, rgba(240, 245, 251, .92) 30% 56%, rgba(160, 175, 195, .7) 56.6% 57.4%, rgba(255, 255, 255, .36) 58% 100%); box-shadow: 0 0 0 1px rgba(10, 20, 44, .16); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .disc, .dock-disc, .tv-roll i { animation: none !important; } .tv-roll i { padding-left: 0; } html { scroll-behavior: auto; } }

/* 按键 */
.tracks { display: grid; grid-template-columns: repeat(var(--n, 13), minmax(0, 1fr)); gap: 4px; padding: 5px; border-radius: 10px; background: var(--well); box-shadow: inset 0 1px 3px rgba(10, 20, 44, .16), 0 1px 0 var(--gloss); }
.tracks button, .pill, .era-y { border: 1px solid var(--line); background: var(--key); box-shadow: inset 0 1px 0 var(--gloss), 0 1px 1px var(--shadow); border-radius: 6px; cursor: pointer; color: var(--ink); }
.tracks button { padding: 6px 0 5px; text-align: center; line-height: 1.15; min-width: 0; }
.tracks small { display: block; font: 400 7.5px/1 var(--f-tech); color: var(--mute); letter-spacing: .08em; margin-bottom: 3px; }
.tracks b { font: 400 16px/1 var(--f-lcd); }
.tracks button[aria-pressed="true"], .pill.go { color: #fff; text-shadow: 0 -1px 0 rgba(0, 40, 120, .5); background: linear-gradient(180deg, #a9dcff 0%, #3a97f4 48%, #1270e2 52%, #4fb0ff 100%); border-color: #0d57c4; box-shadow: inset 0 1px 1px rgba(255, 255, 255, .8), 0 1px 2px rgba(0, 40, 120, .4); }
.tracks button[aria-pressed="true"] small { color: inherit; }
.pill { padding: 5px 15px; text-decoration: none; display: inline-block; font-size: 14px; }
.pill:hover, .era-y:hover { border-color: var(--accent); }
.pill[disabled] { opacity: .45; cursor: default; }

/* 果冻按钮 */
.play, .tune li:hover .play, .tracklist li:hover .play { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 4px 12px; border-radius: 999px; border: 1px solid #0d57c4; color: #fff; text-shadow: 0 -1px 0 rgba(0, 40, 120, .55); font-size: 12.5px; font-weight: 600; text-decoration: none; white-space: nowrap; line-height: 1.35; background: linear-gradient(180deg, #7cc4ff 0%, #2b89ee 48%, #0f62d8 52%, #39a2ff 100%); box-shadow: inset 0 -2px 4px rgba(170, 232, 255, .6), 0 1px 3px rgba(0, 40, 120, .4); }
.play::before { content: ""; width: 0; height: 0; border-style: solid; border-width: 4.5px 0 4.5px 7.5px; border-color: transparent transparent transparent currentColor; }
.play::after { content: ""; position: absolute; left: 7px; right: 7px; top: 1px; height: 46%; border-radius: 999px; background: linear-gradient(180deg, rgba(255, 255, 255, .82), rgba(255, 255, 255, .08)); pointer-events: none; }
.play:hover { filter: brightness(1.08); }
.play.alt { color: var(--ink); text-shadow: none; border-color: var(--line); background: var(--key); box-shadow: inset 0 1px 0 var(--gloss), 0 1px 1px var(--shadow); }
.play.alt::after { display: none; }
.play.big { padding: 9px 22px; font-size: 15.5px; }
/* 列表里的播放键平时安静，鼠标移到这一行才亮 */
.tune li:not(:hover) .play:not(.on), .tracklist li:not(:hover) .play:not(.on) { background: none; border-color: var(--line); box-shadow: none; color: var(--accent); text-shadow: none; font-weight: 500; }
.tune li:not(:hover) .play:not(.on)::after, .tracklist li:not(:hover) .play:not(.on)::after { display: none; }
.play.on::before { border: 0; width: 11px; height: 11px; background: linear-gradient(currentColor, currentColor) 0 100% / 3px 60% no-repeat, linear-gradient(currentColor, currentColor) 50% 100% / 3px 100% no-repeat, linear-gradient(currentColor, currentColor) 100% 100% / 3px 40% no-repeat; animation: eq .8s ease-in-out infinite alternate; }
@keyframes eq { to { background-size: 3px 100%, 3px 45%, 3px 85%; } }
@media (prefers-reduced-motion: reduce) { .play.on::before { animation: none; } }
.plays { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.sec-h .plays, .listing .plays { margin: 0; }

/* 段落结构 */
.sec { padding-block: 30px; }
.sec-h { position: relative; display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.sec-h::after { content: ""; position: absolute; left: 0; bottom: -2px; width: 76px; height: 3px; border-radius: 2px; background: var(--holo); }
.sec-h h2 { font-size: 29px; }
.page-h { padding-block: 34px 14px; }
.page-h h1 { font-size: clamp(40px, 6vw, 70px); width: fit-content; }
.page-h h1[data-en] { position: relative; }
.page-h > p { max-width: 42em; margin: 8px 0 0; color: var(--mute); }
.page-h > h1[data-en]::after { content: attr(data-en); position: absolute; left: 100%; bottom: .32em; margin-left: 16px; font: 400 10px/1 var(--f-tech); letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; -webkit-text-fill-color: var(--mute); color: var(--mute); }
.prose { max-width: 42em; font-size: 15.5px; line-height: 1.9; }
.prose p { margin: 0 0 1em; }
.prose.two { max-width: none; columns: 2; column-gap: 44px; text-align: justify; }

/* 首页年度面板 */
.now { display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px; padding-block: 18px 34px; }
.now-head { display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 14px 26px; align-items: start; padding: 16px; border-radius: 12px; }
.now-art { grid-row: span 2; width: 216px; height: 216px; border-radius: 3px; box-shadow: 0 10px 22px -10px rgba(0, 0, 0, .55); }
.now-copy { min-width: 0; }
.now-tag { display: flex; align-items: center; gap: 12px; margin: 0 0 8px; }
.now-tag .lcd { padding: 2px 9px; font-size: 15px; line-height: 1.4; border-radius: 4px; }
.now-copy h2 { font-size: 36px; }
.now-copy > p:not(.now-tag) { margin: 6px 0 4px; font-size: 15.5px; line-height: 1.7; color: var(--mute); max-width: 46em; }
.now-stats { display: flex; flex-wrap: wrap; gap: 2px 26px; align-self: end; font-family: var(--f-body); font-size: 12.5px; padding: 6px 12px; width: fit-content; }
.now-stats b { font: 400 21px/1 var(--f-lcd); }
.now-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 34px; align-items: start; }
.now-foot { display: flex; flex-wrap: wrap; gap: 6px; }
.more-text { margin-top: 2px; }
.more-text summary { cursor: pointer; color: var(--accent); font-size: 14px; margin-bottom: 10px; }
/* 收起的大事记 */
.fold { border-radius: 10px; }
.fold summary { display: flex; align-items: baseline; gap: 10px; padding: 11px 16px; cursor: pointer; list-style: none; }
.fold summary::-webkit-details-marker { display: none; }
.fold summary b { font: 400 21px/1.2 var(--f-display); }
.fold summary .lcdnum { font-size: 16px; color: var(--accent); }
.fold-hint { margin-left: auto; font-size: 13.5px; color: var(--accent); }
.fold-hint::after { content: "展开 ▾"; }
.fold[open] .fold-hint::after { content: "收起 ▴"; }
.fold-body { padding: 2px 16px 14px; border-top: 1px solid var(--hair); }
.fold-body .frow { padding-top: 12px; }
.ev-scroll { max-height: 560px; overflow-y: auto; margin-top: 8px; padding-right: 10px; scrollbar-width: thin; }
.ev-scroll .mon:first-child { margin-top: 4px; }
.ed-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.ed-mini { padding: 11px 13px; border-radius: 10px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.ed-mini h3 { font-size: 18px; }
.ed-mini h3 a { color: inherit; text-decoration: none; }
.ed-mini h3 a:hover { color: var(--accent); }
.ed-mini h3 small { display: block; font: 400 12.5px/1.4 var(--f-body); color: var(--mute); }
.ed-mini .tech { margin: 2px 0 0; font-size: 8.5px; letter-spacing: .1em; }
.ed-mini ol { margin: 0; padding: 0 0 0 18px; font-size: 13.5px; line-height: 1.5; overflow-wrap: anywhere; }
.ed-mini .plays { margin: 4px 0 0; }

/* 十六年一览 */
.era { display: grid; gap: 8px; }
.era-row { display: grid; grid-template-columns: minmax(0, 1fr) 80px minmax(0, 1fr); gap: 8px; }
.era-head { margin-bottom: 6px; font: 400 18px/1.2 var(--f-display); text-align: center; }
.era-head b { font-weight: 400; color: var(--accent); }
.era-c { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: start; padding: 10px; border-radius: 10px; color: var(--ink); text-decoration: none; min-width: 0; }
a.era-c:hover, .ycard:hover, a.card:hover { border-color: var(--accent); }
.era-c img { width: 92px; height: 92px; border-radius: 2px; }
.era-c > span { display: grid; gap: 3px; min-width: 0; }
.era-c b { font: 400 19px/1.25 var(--f-display); }
.era-c small { color: var(--mute); font-size: 13.5px; line-height: 1.55; }
.era-c .tech { font-size: 8.5px; }
.era-c.none { grid-template-columns: minmax(0, 1fr); place-content: center; text-align: center; color: var(--mute); font-size: 13px; background: none; box-shadow: none; border-style: dashed; }
.era-y { display: grid; place-items: center; font: 400 20px/1 var(--f-lcd); text-decoration: none; }

/* 榜单连播台：一块点歌面板 */
.scroll { overflow-x: auto; border-radius: 10px; }
table.board { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 13.5px; }
.board th, .board td { padding: 4px 3px; border-bottom: 1px solid var(--hair); text-align: center; }
.board tr:last-child th, .board tr:last-child td { border-bottom: 0; }
.board thead th { font-weight: 400; color: var(--mute); }
.board tbody th, .board thead th:first-child { position: sticky; left: 0; z-index: 1; min-width: 150px; max-width: 200px; text-align: left; padding-left: 12px; font-weight: 500; line-height: 1.3; background: var(--solid); }
.board tbody th a { color: inherit; text-decoration: none; }
.board tbody th a:hover { color: var(--accent); }
.cell { display: block; min-width: 30px; padding: 3px 0; border-radius: 4px; color: var(--lcd-ink); font: 400 13.5px/1.3 var(--f-lcd); text-decoration: none; background: linear-gradient(180deg, var(--lcd), var(--lcd-b)); box-shadow: inset 0 1px 2px rgba(4, 30, 70, .26); }
.cell:hover { color: #fff; background: linear-gradient(180deg, #7cc4ff, #2b89ee 48%, #0f62d8 52%, #39a2ff); }
.chart-card > a { display: grid; gap: 6px; color: inherit; text-decoration: none; }
.chart-card > a:hover h3 { color: var(--accent); }
.chart-card p { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }
.chart-card .plays { margin: 2px 0 0; align-items: center; }
.whole { display: grid; gap: 4px; margin: 14px 0 10px; padding: 12px 16px; border-radius: 10px; font-size: 13.5px; }
.whole b { font: 400 21px/1.2 var(--f-display); }
.whole .plays { margin: 6px 0 0; }
.whole details { margin-top: 6px; font-size: 13px; }
.whole summary { cursor: pointer; }

/* CD 盒 */
.case { position: relative; display: block; aspect-ratio: 1; width: 100%; background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .09) 0 1px, transparent 1px 4px), linear-gradient(90deg, #0e1222, #39415f 55%, #0b0e1b); overflow: hidden; border-radius: 2px; box-shadow: 0 10px 18px -12px rgba(0, 0, 0, .55), 0 0 0 1px rgba(10, 20, 44, .24); }
.case img, .case .blank { position: absolute; left: 7%; top: 0; width: 93%; height: 100%; object-fit: cover; }
.case::after { content: ""; position: absolute; inset: 0; background: linear-gradient(118deg, rgba(255, 255, 255, .3) 0 19%, rgba(255, 255, 255, 0) 19.4% 100%); pointer-events: none; }
.blank { display: grid; place-items: center; padding: 10%; text-align: center; font: 400 clamp(13px, 2vw, 20px)/1.2 var(--f-display); color: #fff; overflow-wrap: anywhere; }
.albums { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 24px 18px; }
.albums.tight { grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 18px 14px; }
.alb { color: var(--ink); text-decoration: none; display: grid; gap: 8px; min-width: 0; align-content: start; }
.alb .case { transition: transform .16s ease; }
.alb:hover .case { transform: translateY(-3px); }
.alb b { display: block; font-weight: 600; font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; }
.alb small { display: block; color: var(--mute); font-size: 12.5px; line-height: 1.4; }

/* 点歌行 */
.tune { list-style: none; margin: 0; padding: 0; }
.tune li { display: grid; grid-template-columns: 76px minmax(0, 1.5fr) minmax(0, 1fr) 46px 44px 96px; gap: 10px; align-items: center; padding: 8px 6px; border-bottom: 1px solid var(--hair); line-height: 1.35; }
.tune.short li { grid-template-columns: minmax(0, 1fr) 96px; }
.tune li:hover { background: var(--well); }
.tune .no { font: 400 13px/1 var(--f-lcd); color: var(--mute); }
.tune .ti { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.tune .ti small { font-weight: 400; color: var(--mute); display: block; font-size: 12.5px; }
.tune .by { min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.tune .by a, .tune .ti a { color: inherit; text-decoration: none; }
.tune .by a:hover, .tune .ti a:hover { color: var(--accent); }
.tune .yr { font: 400 14px/1 var(--f-lcd); color: var(--mute); }
.tune .lg { font-size: 12px; color: var(--mute); }
.tune .act { text-align: right; }
/* 正在放的歌，歌名像 KTV 字幕一样走色 */
.tune li:has(.play.on) .ti { background: linear-gradient(90deg, var(--accent) 50%, var(--ink) 50%) 100% 0 / 200% 100% no-repeat; -webkit-background-clip: text; background-clip: text; color: transparent; animation: wipe 7s linear infinite; }
.tune li:has(.play.on) .ti small, .tune li:has(.play.on) .ti a { -webkit-text-fill-color: var(--mute); }
@keyframes wipe { to { background-position: 0 0; } }
@media (prefers-reduced-motion: reduce) { .tune li:has(.play.on) .ti { animation: none; background-position: 0 0; } }
.tune.wide li { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) 46px 96px; }
.tune.wide li:has(.no) { grid-template-columns: 44px minmax(0, 1.6fr) minmax(0, 1fr) 46px 96px; }

/* 筛选 */
.filters { display: grid; gap: 8px; padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; }
.frow { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.frow > .tech { min-width: 58px; }
.chip { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 1px 11px; cursor: pointer; font-size: 13.5px; color: var(--ink); line-height: 1.6; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { color: #fff; text-shadow: 0 -1px 0 rgba(0, 40, 120, .5); background: linear-gradient(180deg, #a9dcff 0%, #3a97f4 48%, #1270e2 52%, #4fb0ff 100%); border-color: #0d57c4; box-shadow: inset 0 1px 1px rgba(255, 255, 255, .8); }
.listing { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; color: var(--mute); font-size: 13.5px; }
.pager { display: flex; justify-content: center; align-items: center; gap: 12px; padding-block: 18px; }
.linebar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.linebar .chip { text-decoration: none; font-size: 15px; padding: 4px 15px; display: inline-flex; align-items: baseline; gap: 7px; }
.linebar small { font: 400 12px/1 var(--f-lcd); opacity: .8; }

/* 歌手 */
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 12px; }
.who { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: center; color: var(--ink); text-decoration: none; padding: 8px; border-radius: 8px; border: 1px solid transparent; }
.who:hover { background: var(--well); border-color: var(--line); }
.who b { display: block; font-size: 15.5px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.who small { display: block; color: var(--mute); font-size: 12.5px; line-height: 1.35; overflow-wrap: anywhere; }
.face { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; background: linear-gradient(135deg, #8fb6e8, #c7a8ea); color: #fff; display: grid; place-items: center; font: 400 22px/1 var(--f-display); flex: none; box-shadow: 0 0 0 1px var(--line), 0 0 0 3px var(--gloss); }
.face img { width: 100%; height: 100%; object-fit: cover; }
.letter { font: 400 22px/1 var(--f-tech); color: var(--accent); padding-block: 16px 8px; }

/* 词条 */
.entry { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; align-items: start; padding-block: 28px; }
.entry-h h1 { font-size: clamp(40px, 6.6vw, 74px); width: fit-content; }
.entry-h .sub { color: var(--mute); margin-top: 6px; }
.box { border-radius: 12px; padding: 14px; display: grid; gap: 12px; position: sticky; top: 78px; }
.box dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 12px; font-size: 14px; line-height: 1.45; }
.box dt { color: var(--mute); white-space: nowrap; }
.box dd { margin: 0; overflow-wrap: anywhere; }
.box .links { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13.5px; }
.portrait { aspect-ratio: 1; width: 100%; object-fit: cover; object-position: 50% 20%; border-radius: 6px; }
.credit { font-size: 11.5px; color: var(--mute); line-height: 1.4; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.tag { font-size: 12.5px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--mute); text-decoration: none; }
a.tag:hover, button.tag:hover { border-color: var(--accent); color: var(--accent); }
button.tag { background: none; cursor: pointer; }
.tracklist { list-style: none; margin: 0; padding: 0; }
.tracklist li { display: grid; grid-template-columns: 30px minmax(0, 1fr) 50px 96px; gap: 8px; align-items: center; padding: 7px 4px; border-bottom: 1px solid var(--hair); line-height: 1.35; }
.tracklist .n, .tracklist .t { font: 400 13px/1 var(--f-lcd); color: var(--mute); }
.tracklist .h { font-weight: 700; }
.tracklist .hit { color: var(--accent); font-size: 11.5px; margin-left: 6px; font-weight: 500; white-space: nowrap; }

/* 年表 */
.ygrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
.ycard { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 14px; padding: 12px; border-radius: 10px; color: var(--ink); text-decoration: none; align-content: start; }
.ycard img { width: 124px; height: 124px; border-radius: 2px; }
.yb { display: grid; gap: 5px; min-width: 0; }
.yb b { font: 400 21px/1.2 var(--f-display); }
.yb small { color: var(--mute); font-size: 13.5px; line-height: 1.55; }
.year-big { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 32px; align-items: center; margin: 12px 0 16px; }
.year-big > img { width: 300px; height: 300px; border-radius: 3px; box-shadow: 0 18px 34px -16px rgba(0, 0, 0, .55); }
.year-big .lcdnum { display: block; font-size: clamp(40px, 6vw, 64px); line-height: 1; color: var(--accent); margin-bottom: 8px; }
.year-big h1 { font-size: clamp(36px, 5vw, 60px); width: fit-content; }
.year-big p { margin: 8px 0 0; color: var(--mute); max-width: 40em; }
.year-h .frow { margin-bottom: 10px; }
.events { list-style: none; margin: 8px 0 14px; padding: 0; display: grid; gap: 8px; max-width: 46em; }
.events li { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; line-height: 1.65; }
.events time { font: 400 13px/1.9 var(--f-lcd); color: var(--mute); }
.events .tag { padding: 0 7px; font-size: 11.5px; white-space: nowrap; }
.jump { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.mon { font: 400 17px/1.3 var(--f-display); margin: 18px 0 2px; color: var(--accent); }
.src { font-size: 11.5px; color: var(--mute); margin-left: 2px; }
.alist { list-style: none; margin: 0; padding: 0; }
.alist li { display: grid; grid-template-columns: 54px minmax(0, 1.6fr) minmax(0, 1fr); gap: 10px; padding: 7px 4px; border-bottom: 1px solid var(--hair); align-items: baseline; line-height: 1.4; }
.alist time { font: 400 13px/1 var(--f-lcd); color: var(--mute); }
.alist .ti a { color: inherit; }
.alist small { display: block; color: var(--mute); font-size: 12.5px; }
.edition { margin-bottom: 22px; }
.edition h3 { font-size: 21px; margin-bottom: 4px; }
.edition h3 a { color: inherit; }
.edition h3 small { font-size: 13px; color: var(--mute); }
.page-h ~ .sec h4, .edition h4 { font: 600 14px/1.4 var(--f-body); color: var(--mute); margin: 14px 0 2px; }
.prose .sub { font-size: 25px; margin: 28px 0 8px; }

/* 金曲奖 */
table.gma { border-collapse: collapse; width: 100%; min-width: 1040px; font-size: 13.5px; line-height: 1.4; }
.gma th, .gma td { text-align: left; vertical-align: top; padding: 9px 10px; border-bottom: 1px solid var(--hair); }
.gma thead th { font-weight: 600; background: var(--solid); position: sticky; top: 0; }
.gma tbody th { font-weight: 400; white-space: nowrap; }
.gma tbody th b { font: 400 17px/1 var(--f-lcd); display: block; }
.gma td small { display: block; color: var(--mute); font-size: 12px; }

/* 专题 / 幕后 */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.card { display: grid; gap: 6px; align-content: start; padding: 16px; border-radius: 12px; color: var(--ink); text-decoration: none; }
.card h3 { font-size: 23px; }
.topic-card { padding: 0 0 14px; overflow: hidden; }
.topic-card img { width: 100%; height: auto; aspect-ratio: 1; }
.topic-card > :not(img), .card.topic-card > p { margin-inline: 14px; }
.card p { margin: 0; color: var(--mute); font-size: 14px; line-height: 1.6; }
.shuffle { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px; border-radius: 12px; }
.shuffle b { display: block; font-size: 19px; line-height: 1.3; overflow-wrap: anywhere; }
.shuffle small { color: var(--mute); display: block; }
.shuffle-act { display: flex; flex-direction: column; gap: 7px; }

/* 页脚：网页 1.0 的 88×31 小徽章和计数器 */
.foot { position: relative; border-top: 1px solid var(--line); margin-top: 30px; padding-block: 22px 36px; color: var(--mute); font-size: 13px; background: var(--steel); box-shadow: inset 0 1px 0 var(--gloss); }
.foot p { margin: 4px 0 0; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.b88 { display: inline-flex; align-items: center; justify-content: center; gap: 5px; width: 88px; height: 31px; font: 400 7.6px/1 var(--f-tech); letter-spacing: .06em; box-shadow: inset 1px 1px 0 rgba(255, 255, 255, .7), inset -1px -1px 0 rgba(0, 0, 0, .3), 0 0 0 1px rgba(10, 20, 44, .34); overflow: hidden; white-space: nowrap; }
.b88 b { font-weight: 400; font-size: 9.5px; }

.b88.ink b { font-size: 6.6px; opacity: .7; }
.foot-count b { padding: 1px 6px; border-radius: 3px; font-weight: 400; color: var(--lcd-ink); background: linear-gradient(180deg, var(--lcd), var(--lcd-b)); box-shadow: inset 0 1px 2px rgba(4, 30, 70, .3); }

/* 千禧生活 */
.subnav { background: var(--well); border-bottom: 1px solid var(--line); }
.subnav[hidden] { display: none; }
.subnav .wrap { display: flex; flex-wrap: wrap; gap: 2px 14px; padding-block: 6px; }
.subnav a { color: var(--mute); text-decoration: none; font-size: 13.5px; padding: 1px 2px; border-bottom: 2px solid transparent; }
.subnav a:hover { color: var(--accent); }
.subnav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.dial-h { gap: 10px; margin-bottom: 8px; align-items: baseline; }
.dial-h b { font: 400 22px/1.2 var(--f-display); }
.tabs { display: flex; flex-wrap: wrap; gap: 3px; border-bottom: 1px solid var(--line); }
.tabs button { padding: 5px 15px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: none; color: var(--mute); cursor: pointer; font-size: 14.5px; }
.tabs button:hover { color: var(--accent); }
.tabs button[aria-selected="true"] { color: var(--ink); background: var(--plate); border-color: var(--line); box-shadow: inset 0 1px 0 var(--gloss); margin-bottom: -1px; padding-bottom: 6px; }
.now-tab { display: grid; gap: 26px; min-width: 0; }
.digest { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.dig { padding: 11px 14px 12px; border-radius: 10px; background: var(--plate); border: 1px solid var(--line); box-shadow: inset 0 1px 0 var(--gloss); min-width: 0; }
.dig h3 button { padding: 0; border: 0; background: none; color: var(--ink); font: 400 20px/1.25 var(--f-display); cursor: pointer; }
.dig h3 button:hover { color: var(--accent); }
.dig > p { margin: 3px 0 4px; color: var(--mute); font-size: 14px; }
.dig ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; }
.dig li { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 14.5px; line-height: 1.4; }
.dig li a { color: inherit; text-decoration: none; }
.dig li a:hover { color: var(--accent); text-decoration: underline; }
.dig small { flex: none; color: var(--mute); font-size: 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.tile { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; padding: 13px 15px; border-radius: 10px; color: var(--ink); text-decoration: none; background: var(--plate); border: 1px solid var(--line); box-shadow: inset 0 1px 0 var(--gloss); }
.tile:hover { border-color: var(--accent); }

.tile small { grid-column: 1 / -1; color: var(--mute); font-size: 13.5px; line-height: 1.55; }
/* 专栏一览：目录式，靠细线分隔，不用卡片 */
.f-body { padding-top: 20px; }
.cols { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 46px; border-top: 2px solid var(--ink); }
.cols li { border-bottom: 1px solid var(--line); }
.cols a { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; align-items: start; padding: 15px 0 16px; color: var(--ink); text-decoration: none; }
.cols a:not(:has(img)) { grid-template-columns: minmax(0, 1fr); }
.col-b { display: grid; gap: 3px; min-width: 0; }
.col-c { width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; box-shadow: 0 10px 22px -14px var(--shadow), 0 0 0 1px var(--line); background: var(--well); }
.cols a:hover b { color: var(--accent); }
.cols b { font: 400 25px/1.25 var(--f-display); }
.cols small { color: var(--mute); font-size: 14.5px; line-height: 1.7; }
.col-m { font-size: 12px; color: var(--mute); }
/* 词条索引：按类别列名字 */
.ent-idx { columns: 3; column-gap: 34px; }
.ent-idx section { break-inside: avoid; margin-bottom: 16px; }
.ent-idx h3 { font-size: 19px; padding-bottom: 3px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
.ent-idx ul { list-style: none; margin: 0; padding: 0; }

.ent-idx a:hover { color: var(--accent); text-decoration: underline; }
.ent-idx small { flex: none; font-size: 11.5px; color: var(--mute); }
/* 关于页的补充留言 */
.fb { display: grid; gap: 12px; max-width: 46rem; margin: 4px 0 20px; }
.fb label { display: grid; gap: 6px; font-size: 14px; color: var(--mute); }
.fb select, .fb textarea, .fb input { font: inherit; color: var(--ink); background: var(--solid); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; max-width: 100%; }
.fb textarea { resize: vertical; min-height: 110px; line-height: 1.6; }

.fb-h { margin: 8px 0; font-size: 17px; }
.fb-items { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; max-width: 46rem; }
.fb-items li { padding: 12px 14px; border: 1px solid var(--hair); border-radius: 12px; background: var(--well); }
.fb-items p { margin: 0 0 4px; line-height: 1.7; }
.fb-items small { color: var(--mute); }

/* 剧集年表 */
.drs { list-style: none; margin: 0 0 18px; padding: 0; max-width: 46rem; }
.dr { padding: 14px 0 12px; border-bottom: 1px solid var(--hair); scroll-margin-top: 90px; }
.dr.hit { background: var(--well); box-shadow: -10px 0 0 var(--well), 10px 0 0 var(--well); }
.dr-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 8px; }

.dr-e { font-size: 13px; color: var(--mute); }
.dr-m { margin: 4px 0 0; font-size: 13.5px; line-height: 1.6; color: var(--mute); }
.dr-n { margin: 6px 0 0; line-height: 1.75; }
.dr-s { margin: 6px 0 0; font-size: 14px; line-height: 1.7; }
.dr-s small { margin-left: 4px; color: var(--mute); }
.dr-s .dot { color: var(--mute); }
.dr-chips { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0; max-width: 46rem; line-height: 1.7; }
.dr-chips small { margin-left: 4px; font-size: 11.5px; color: var(--mute); }
.year-h small { font-size: 14px; color: var(--mute); }
.year-h { font: 400 30px/1.1 var(--f-lcd); margin: 26px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--ink); max-width: 46rem; }
/* 文中提到的歌：点一下切到这首 */
.sl { color: inherit; text-decoration: underline dotted var(--accent); text-underline-offset: 3px; }
.sl::after { content: "♪"; margin-left: 1px; font-size: .72em; color: var(--accent); vertical-align: .22em; }
.sl:hover, .sl.on { color: var(--accent); }
.sl.on { font-weight: 600; }
/* 专栏文章里的照片和影像 */
.col-text figure { margin: 22px 0 24px; }
.col-text figcaption { margin-top: 7px; color: var(--mute); font-size: 13.5px; line-height: 1.65; }
.col-text figcaption b { display: block; color: var(--ink); font-weight: 600; font-size: 14.5px; }
.col-text figcaption small { display: block; font-size: 11.5px; opacity: .85; }
.ph img { width: 100%; height: auto; border-radius: 6px; box-shadow: 0 12px 24px -16px var(--shadow), 0 0 0 1px var(--line); }
.md { max-width: 500px; }
.md-tv { position: relative; display: block; width: 100%; padding: 13px; border: 0; border-radius: 18px; cursor: pointer; background: linear-gradient(162deg, #f7f9fc 0%, #dfe5ed 36%, #bfc8d5 74%, #d3dae4 100%); box-shadow: inset 0 2px 1px rgba(255, 255, 255, .95), inset 0 -3px 6px rgba(40, 55, 85, .3), 0 0 0 1px rgba(10, 20, 44, .24), 0 16px 24px -16px rgba(16, 26, 54, .6); }
:root[data-theme="dark"] .md-tv { background: linear-gradient(162deg, #454d62 0%, #2c3244 40%, #1b1f2d 78%, #272c3c 100%); }
.md-tv img { width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; background: #05070f; border-radius: 22px / 18px; box-shadow: 0 0 0 5px #14171f; }
.md-bili { min-height: 200px; }
.md-bili:not(:has(img)) { background: linear-gradient(135deg, #fb7299, #23ade5); }
.md-bili img { aspect-ratio: 16 / 10; }
.md-out { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); padding: 3px 12px; border-radius: 999px; background: rgba(5, 10, 24, .72); color: #fff; font-size: 13px; white-space: nowrap; }
.md-go { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px 0 0 -31px; border-radius: 50%; background: linear-gradient(180deg, #7cc4ff 0%, #2b89ee 48%, #0f62d8 52%, #39a2ff 100%); box-shadow: inset 0 -3px 6px rgba(170, 232, 255, .6), 0 3px 9px rgba(0, 20, 70, .6); }
.md-go::after { content: ""; position: absolute; left: 24px; top: 18px; border-style: solid; border-width: 13px 0 13px 21px; border-color: transparent transparent transparent #fff; }
.md-tv:hover .md-go { filter: brightness(1.12); }
.md-on { cursor: default; }
.md-frame { aspect-ratio: 4 / 3; border-radius: 22px / 18px; overflow: hidden; background: #000; box-shadow: 0 0 0 5px #14171f; }
.md-frame iframe { display: block; width: 100%; height: 100%; border: 0; }
.col-top .plays { margin-top: 8px; }
/* 专栏文章 */
.col-h h1 { font-size: clamp(32px, 4.4vw, 52px); }
.col-top { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 26px; align-items: center; margin-top: 10px; }
.col-top h1 { background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; filter: var(--chrome-fx); -webkit-text-stroke: .5px var(--chrome-edge); }
.col-top p { max-width: 42em; color: var(--mute); }
.col-h .jump { margin-top: 16px; }
.col-text { font-size: 16.5px; line-height: 1.95; }
.col-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 30px 0 10px; padding-top: 14px; border-top: 2px solid var(--ink); }
.col-nav a { color: var(--ink); text-decoration: none; font: 400 20px/1.3 var(--f-display); }
.col-nav a:last-child { text-align: right; }
.col-nav a:hover { color: var(--accent); }
.col-nav small { display: block; font: 400 12.5px/1.6 var(--f-body); color: var(--mute); }
.ent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.ent { --c: #8fb6e8; position: relative; display: grid; gap: 2px; align-content: start; padding: 10px 13px 11px 16px; border-radius: 8px; color: var(--ink); text-decoration: none; background: var(--plate); border: 1px solid var(--line); box-shadow: inset 0 1px 0 var(--gloss); overflow: hidden; }
.ent::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); }
.ent:hover { border-color: var(--accent); }

.ent[data-f="screen"] { --c: #e0719a; } .ent[data-f="net"] { --c: #3a8fe0; } .ent[data-f="school"] { --c: #4fae7a; } .ent[data-f="life"] { --c: #d9a03a; } .ent[data-f="world"] { --c: #c8352f; } .ent[data-f="sport"] { --c: #2fa6a0; } .ent[data-f="sub"] { --c: #8a5fd0; }
.glimpse { display: grid; gap: 8px; justify-items: start; padding-block: 6px 10px; }
.glimpse h3 { font-size: 34px; margin: 2px 0 6px; }
.glimpse h3 a { color: inherit; text-decoration: none; }
.glimpse p { margin: 0 0 6px; max-width: 34em; font-size: 15.5px; line-height: 1.8; }
.days { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.day { padding: 14px 16px; border-radius: 12px; background: var(--plate); border: 1px solid var(--line); box-shadow: inset 0 1px 0 var(--gloss); }
.day h3 { font-size: 24px; }
.day ol { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 7px; }
.day li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px; line-height: 1.6; font-size: 14.5px; }

.day li a { color: inherit; text-decoration-color: var(--line); }
.ent-y { margin: 4px 0 0; font-size: 22px; color: var(--accent); }
.ent-scene { color: var(--mute); border-left: 3px solid var(--line); padding-left: 12px; }
.foot-dream { margin: 0 0 12px; font-size: 12px; }

@media (max-width: 760px) {
  .ent-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* 千禧一梦 */
.dream { position: fixed; inset: 0; z-index: 44; background: #1a1412; overflow: hidden; }
.dream[hidden] { display: none; }
.dream canvas { display: block; width: 100%; height: 100%; touch-action: none; image-rendering: auto; }
body.in-dream { overflow: hidden; }
/* 家用录像机叠在画面上的字 */
.d-vhs { position: absolute; left: 28px; top: 22px; display: grid; gap: 2px; color: #fdf6e3; font: 400 22px/1.15 var(--f-lcd); letter-spacing: .06em; text-shadow: 1.5px 0 0 rgba(255, 60, 90, .55), -1.5px 0 0 rgba(60, 200, 255, .55); pointer-events: none; }
.d-vhs b { font-weight: 400; font-size: 26px; }
.d-where { position: absolute; left: 28px; bottom: 26px; color: #fdf6e3; font: 400 24px/1.2 var(--f-display); text-shadow: 0 1px 8px rgba(60, 30, 10, .7); pointer-events: none; }
.has-dock .d-where { bottom: 110px; }
.d-tip { position: fixed; left: 0; top: 0; z-index: 2; padding: 2px 8px; color: #26180e; background: rgba(255, 244, 222, .9); font: 500 13px/1.5 var(--f-body); border-radius: 3px; pointer-events: none; }
.d-years { position: absolute; right: 22px; top: 20px; display: grid; grid-template-columns: repeat(8, 30px); gap: 3px; }

.d-wake { position: absolute; right: 22px; top: 80px; padding: 3px 14px; border: 1px solid rgba(255, 246, 225, .6); border-radius: 3px; background: rgba(60, 40, 25, .22); color: #fdf6e3; font: 400 14px/1.5 var(--f-body); cursor: pointer; }
.d-wake:hover { background: rgba(255, 246, 225, .92); color: #2a1c10; }
.d-card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -54%) rotate(-.6deg); width: min(440px, calc(100vw - 32px)); max-height: 68vh; overflow-y: auto; padding: 18px 20px 16px; color: #2a2118; background: #f6eedb; box-shadow: 0 18px 44px rgba(50, 25, 10, .5), inset 0 0 0 1px rgba(90, 60, 30, .18); font-size: 15px; line-height: 1.75; }
.d-card[hidden] { display: none; }
.d-card h3 { font-size: 27px; margin: 2px 0 6px; }

.d-card .tech { color: #7a5f42; }
.d-card a:not(.play) { color: #1a56a8; }
.d-scene { color: #6a5540; }
.d-x { float: right; margin: -6px -8px 0 8px; padding: 0 8px; border: 0; background: none; color: #7a5f42; font: 400 13px/1.8 var(--f-body); cursor: pointer; }
.d-hint { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); margin: 0; padding: 3px 12px; color: #fdf6e3; background: rgba(50, 30, 16, .34); font-size: 14px; pointer-events: none; transition: opacity 1.4s ease; }
.d-hint.gone { opacity: 0; }
.has-dock .d-hint { bottom: 112px; }
.d-flash { position: absolute; inset: 0; background: #fff6e4; opacity: 0; pointer-events: none; transition: opacity .55s ease; }
.d-flash.on { opacity: 1; transition-duration: .5s; }
@media (max-width: 760px) {
  .d-vhs { left: 14px; top: 12px; font-size: 16px; } .d-vhs b { font-size: 18px; }
  .d-where { left: 14px; bottom: 14px; font-size: 20px; }
  .has-dock .d-where { bottom: 148px; }
  .d-years { right: 10px; top: 12px; grid-template-columns: repeat(8, 24px); }
  .d-years button { height: 22px; font-size: 11px; }
  .d-wake { right: 10px; top: 66px; }
}

/* 站内播放器：一台随身 CD 机的线控 */
body.has-dock { padding-bottom: 92px; }
.dock { position: fixed; inset: auto 0 0; z-index: 45; pointer-events: none; }
.dock[hidden] { display: none; }
.dock-bar { pointer-events: auto; display: grid; grid-template-columns: 56px minmax(170px, 1fr) auto minmax(170px, 1fr) auto; gap: 12px; align-items: center; padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--steel); border-top: 1px solid rgba(10, 20, 44, .3); box-shadow: inset 0 1px 0 var(--gloss), 0 -6px 20px -8px var(--shadow); }
.dock-stage { pointer-events: auto; position: absolute; right: 16px; bottom: calc(100% + 12px); width: 372px; display: grid; gap: 8px; }
.dock.big .dock-stage { width: min(720px, calc(100vw - 32px)); }

.dock-tv { position: relative; }
.dock:not(.tv-on) .dock-tv { position: fixed; left: -1400px; top: 0; width: 356px; pointer-events: none; }
.dock:not(.tv-on) #dk-size { display: none; }
.dock-ant { position: absolute; left: 30%; bottom: calc(100% - 6px); width: 32%; }
.dock-case { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 12px; padding: 13px 10px 13px 15px; border-radius: 18px; background: linear-gradient(162deg, #f7f9fc 0%, #dfe5ed 36%, #bfc8d5 74%, #d3dae4 100%); box-shadow: inset 0 2px 1px rgba(255, 255, 255, .95), inset 0 -3px 6px rgba(40, 55, 85, .3), 0 0 0 1px rgba(10, 20, 44, .24), 0 20px 30px -14px rgba(16, 26, 54, .6); }
:root[data-theme="dark"] .dock-case { background: linear-gradient(162deg, #454d62 0%, #2c3244 40%, #1b1f2d 78%, #272c3c 100%); box-shadow: inset 0 2px 1px rgba(255, 255, 255, .22), inset 0 -3px 6px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .1), 0 20px 30px -14px #000; }
.dock-video { position: relative; aspect-ratio: 4 / 3; min-height: 200px; background: #05070f; border-radius: 26px / 20px; overflow: hidden; box-shadow: 0 0 0 6px #14171f, 0 0 0 7px rgba(255, 255, 255, .5); }
.dock-video::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .1) 0 1px, transparent 1px 3px); box-shadow: inset 0 0 18px rgba(0, 0, 0, .55); }
.dock-side { display: flex; flex-direction: column; align-items: center; gap: 7px; min-height: 0; }
.dock-led { align-self: flex-end; width: 7px; height: 7px; border-radius: 50%; background: #47e66b; box-shadow: 0 0 6px #47e66b; }
.dock-ch { font-size: 11.5px; color: #2b3448; }
:root[data-theme="dark"] .dock-ch { color: #dbe4f5; }
.dock-knob { position: relative; width: 40px; height: 40px; flex: none; border-radius: 50%; background: repeating-conic-gradient(#fdfeff 0deg 9deg, #8b95a7 9deg 18deg); box-shadow: 0 3px 6px -1px rgba(16, 26, 54, .6), 0 0 0 1px rgba(10, 20, 44, .4); }
.dock-knob::before { content: ""; position: absolute; inset: 13%; border-radius: 50%; background: conic-gradient(from 20deg, #f7f9fc, #a9b3c3, #eef1f6, #98a3b5, #f7f9fc); }

<script>(() => {
  const D = window.DATA;
  const view = document.getElementById('view');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const by = (list, key) => Object.fromEntries(list.map(x => [x[key], x]));
  const group = (list, fn) => list.reduce((m, x) => ((m[fn(x)] ??= []).push(x), m), {});
  const fmt = n => n.toLocaleString('zh-CN');

  D.artists.forEach(a => { a.photo = window.FACES?.[a.id]; });
  const artists = by(D.artists, 'id');
  // 没有简介的表演者不进歌手库，歌曲和搜索里仍然找得到
  const listed = D.artists.filter(a => !a.thin);
  const albums = by(D.albums, 'id');
  const songs = by(D.songs, 'id');
  const albumsOf = group(D.albums, b => b.a);
  const songsOf = group(D.songs, s => s.a);
  const songsIn = group(D.songs, s => s.al);
  const albumsAt = group(D.albums, b => b.y);
  const songsAt = group(D.songs, s => s.y);
  const YEARS = D.years.map(y => y.y);
  const LINES = { hktw: '港台线', cn: '内地线' };
  const lineOfRegion = r => (r === '内地' ? 'cn' : 'hktw');
  const lineOfArtist = id => lineOfRegion(artists[id]?.region);
  const yearsOf = l => D.years.filter(y => y[l]);
  const spanOf = l => { const v = yearsOf(l); return `${v[0]?.y}—${v[v.length - 1]?.y}`; };

  const ytSearch = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
  const musicSearch = q => 'https://music.youtube.com/search?q=' + encodeURIComponent(q);
  const ytUrl = s => {
    if (!s.vid) return musicSearch(`${artistName(s)} ${s.t}`);
    return (s.vk === '音频' ? 'https://music.youtube.com/watch?v=' : 'https://www.youtube.com/watch?v=') + s.vid;
  };
  const artistName = s => artists[s.a]?.tw ?? '';
  // 禁止嵌入的视频只能去 YouTube 看，不进站内队列
  const canEmbed = s => s.vid && !s.ne;
  const playLink = (s, label) => {
    const text = label ?? (s.vk || (s.vid ? '视频' : '搜索'));
    if (canEmbed(s)) return `<a class="play" href="${esc(ytUrl(s))}" target="_blank" rel="noopener" data-vid="${s.vid}" aria-label="播放 ${esc(artists[s.a]?.zh)}《${esc(s.t)}》">${esc(text)}</a>`;
    const where = !s.vid || s.vk === '音频' ? 'YouTube Music' : 'YouTube';
    return `<a class="play" href="${esc(ytUrl(s))}" target="_blank" rel="noopener" aria-label="在 ${where} 打开 ${esc(artists[s.a]?.zh)}《${esc(s.t)}》">${esc(text)}</a>`;
  };
  // YouTube 的临时歌单链接一次最多 50 首，超过就拆成几段
  const LIST_MAX = 50;
  const listUrl = vids => `https://www.youtube.com/watch_videos?video_ids=${vids.join(',')}`;
  const vidsOf = list => [...new Set(list.map(x => (x.vid ? x : songs[x.id])).filter(s => s && canEmbed(s)).map(s => s.vid))];
  const slices = list => { const parts = []; for (let i = 0; i < list.length; i += LIST_MAX) parts.push(list.slice(i, i + LIST_MAX)); return parts; };
  const ytList = (vids, text) => `<a class="play alt" href="${listUrl(vids)}" target="_blank" rel="noopener">${esc(text)}</a>`;
  // 站内连播不限首数，按住 Ctrl 点击时打开前 50 首的 YouTube 临时歌单
  const playLinkAll = (vids, text, mode) => `<a class="play${mode ? ' alt' : ''}" href="${listUrl(vids.slice(0, LIST_MAX))}" target="_blank" rel="noopener" data-vids="${vids.join(',')}"${mode ? ` data-mode="${mode}"` : ''}>${esc(text)}</a>`;
  const playAll = (list, name = '连播') => {
    const vids = vidsOf(list);
    if (vids.length < 2) return '';
    return `<div class="plays">${playLinkAll(vids, `${name} ${vids.length} 首`)}${vids.length > 9 ? playLinkAll(vids, '随机', 'shuffle') : ''}</div>`;
  };
  const editionSongs = e => e.groups.flatMap(g => g.items.filter(it => it.id));
  const editionsAt = (yr, l) => D.charts.filter(c => c.track === l).flatMap(c => c.editions.filter(e => e.y === yr).map(e => [c, e]));
  // 整榜按年份串起来，同一首歌只放一次，分段时标出每段的年份
  const chartRuns = c => {
    const seen = new Set(), run = [];
    for (const e of c.editions.slice().sort((x, y) => x.y - y.y)) for (const v of vidsOf(editionSongs(e))) if (!seen.has(v)) { seen.add(v); run.push([v, e.y]); }
    const parts = slices(run);
    return parts.map(p => {
      const [from, to] = [p[0][1], p[p.length - 1][1]];
      return { vids: p.map(x => x[0]), text: parts.length === 1 ? `连播全榜 ${p.length} 首` : `${from === to ? from : `${from}—${to}`} · ${p.length} 首` };
    });
  };
  // 条形码宽度由字符算出，每次渲染都一样
  const barcode = (text = '4711997200012') => {
    let x = 0;
    const bars = [...text].flatMap(c => [1 + (+c % 3), 1 + ((+c + 1) % 2), 1 + ((+c * 3) % 4), 1 + ((+c + 2) % 2)]).map((w, i) => { const r = i % 2 ? '' : `<rect x="${x}" width="${w}" height="22"/>`; x += w; return r; }).join('');
    return `<svg class="barcode" viewBox="0 0 ${x} 22" preserveAspectRatio="none" aria-hidden="true">${bars}</svg>`;
  };
  const artistLink = id => artists[id] ? `<a href="#a-${id}">${esc(artists[id].zh)}</a>` : '';
  const creditOf = s => (s.by ?? [s.a]).map(artistLink).join(' / ') + (s.feat ? ` feat. ${esc(s.feat)}` : '');

  const coverHue = id => [...id].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);

  // 首页的榜单卡片：列出第一个有歌的奖项，下面放本届连播

  };
  /* 首页的电视：调台旋钮上的刻度就是年份 */
  const tvYears = D.years.map(v => v.y);
  const knobAt = y => tvYears.indexOf(y) * 300 / (tvYears.length - 1) - 150;
  const knobFace = () => tvYears.map(y => {

  // 字幕：每个切面轮流出一条，只属于这一年的排在前面
  const tvNews = y => {

  let tvOn = null, tvHold = 0;

    else if (h === 'life') { location.hash = '#f-life'; return; }
    else if (h.startsWith('col-')) { columnPage(h.slice(4)); const c = (D.columns ?? []).find(x => x.id === h.slice(4)); if (c) nav = `f-${c.facet}`; }
    else if (h.startsWith('e-')) { entryPage(h.slice(2)); const e = (D.culture ?? []).find(x => x.id === h.slice(2)); if (e) nav = `f-${facetOf(e)}`; }
    else if (h === 'makers') { makersView(); nav = 'makers'; }
    else if (h === 'about') { aboutView(); nav = 'about'; }
    else if (h.startsWith('a-')) { artistPage(h.slice(2)); nav = 'artists'; }
    else if (h.startsWith('b-')) { albumPage(h.slice(2)); nav = 'albums'; }
    else if (h.startsWith('c-')) { chartPage(h.slice(2)); nav = 'charts'; }
    else if (h.startsWith('t-')) { topicPage(h.slice(2)); nav = 'topics'; }
    else notFound();
    const inMusic = MUSIC.includes(nav);
    const top = inMusic ? '#music' : nav.startsWith('f-') ? `#${nav}` : `#${nav}`;
    document.querySelectorAll('.nav a').forEach(a => (a.getAttribute('href') === top ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
    $('subnav').hidden = !inMusic;
    document.querySelectorAll('#subnav a').forEach(a => (a.getAttribute('href') === `#${nav}` ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
    window.scrollTo({ top: 0, behavior: 'instant' });
    followPage();
  };
  addEventListener('hashchange', route);
  route();
  bootBgm();
})();
</script>
</body>
</html>
