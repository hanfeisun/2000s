<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>千禧年华语音乐大百科</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23a9d0ff'/%3E%3Cpath d='M16 16L31 16A15 15 0 0 1 16 31Z' fill='%23ffc0e7'/%3E%3Cpath d='M16 16L1 16A15 15 0 0 1 16 1Z' fill='%23fff0ae'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%230e1336'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Noto+Sans+SC:wght@400;500;600;700&family=Share+Tech+Mono&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>/* 概念：千禧年的随身 CD 机与 KTV 点歌台。银色机身、蓝光液晶、彩虹光盘；深色主题是午夜包厢。 */
:root {
  --bg: #d5dfe9; --body: #e7edf3; --panel: #f7fafc; --line: #a7b6c6; --ink: #0d1a3a; --mute: #49597a;
  --accent: #0a3cf0; --hot: #d30f70; --lcd: #bee8ff; --lcd-ink: #06264f; --on-accent: #ffffff;
  --steel-a: #fbfdff; --steel-b: #c3cfdb; --hinge: #1a2340; --shadow: rgba(13, 26, 58, .16);
  --f-display: 'ZCOOL QingKe HuangYou', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --f-body: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --f-tech: 'Michroma', 'Eurostile', 'Bank Gothic', 'Noto Sans SC', sans-serif;
  --f-lcd: 'Share Tech Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090d29; --body: #0e1336; --panel: #161d4a; --line: #333f80; --ink: #e8eeff; --mute: #a6b2dc;
    --accent: #72c4ff; --hot: #ff62ae; --lcd: #0b2c5e; --lcd-ink: #a3e7ff; --on-accent: #081033;
    --steel-a: #27306b; --steel-b: #141a44; --hinge: #03051a; --shadow: rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090d29; --body: #0e1336; --panel: #161d4a; --line: #333f80; --ink: #e8eeff; --mute: #a6b2dc;
  --accent: #72c4ff; --hot: #ff62ae; --lcd: #0b2c5e; --lcd-ink: #a3e7ff; --on-accent: #081033;
  --steel-a: #27306b; --steel-b: #141a44; --hinge: #03051a; --shadow: rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.75 var(--f-body);
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--steel-a); }
a { color: var(--accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--hot); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: .01em; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tech { font-family: var(--f-tech); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.lcdnum { font-family: var(--f-lcd); font-variant-numeric: tabular-nums; }

/* 机身导航 */
.deck { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: linear-gradient(180deg, var(--steel-a), var(--steel-b)); border-bottom: 1px solid var(--line); box-shadow: 0 2px 10px var(--shadow); }
.deck-in { display: flex; align-items: center; gap: 18px; padding-block: 9px; }
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); flex: none; }
.brand-disc { width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle, var(--steel-a) 0 16%, transparent 17%), conic-gradient(#bcd8ff, #ffc6ea, #fff0b4, #b5ffe0, #a8c8ff, #f6c5ff, #bcd8ff); box-shadow: inset 0 0 0 1px var(--line); }
.brand b { font: 400 19px/1 var(--f-display); white-space: nowrap; }
.nav { display: flex; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { padding: 5px 10px; border-radius: 999px; color: var(--ink); text-decoration: none; font-size: 14px; white-space: nowrap; }
.nav a:hover { background: var(--panel); }
.nav a[aria-current="page"] { background: var(--accent); color: var(--on-accent); }
.search { position: relative; flex: 0 1 240px; min-width: 150px; }
.search input { width: 100%; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); outline-offset: 0; }
.results { position: absolute; right: 0; top: calc(100% + 7px); width: min(420px, calc(100vw - 32px)); max-height: 66vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 34px var(--shadow); padding: 5px; }
.results a { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 6px 8px; border-radius: 7px; color: var(--ink); text-decoration: none; line-height: 1.35; }
.results a:hover, .results a.on { background: var(--bg); }
.results small { color: var(--mute); display: block; font-size: 12px; }
.results .none { padding: 12px; color: var(--mute); }

/* 首页主机 */
.player { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 34px; align-items: center; padding-block: 40px 28px; }
.player h1 { font-size: clamp(46px, 8.6vw, 112px); line-height: .98; }
.player h1 span { display: block; }
.player h1 em { font-style: normal; color: var(--accent); }
.player .lede { max-width: 34em; margin: 16px 0 0; font-size: 16px; }
.disc-box { position: relative; aspect-ratio: 1; width: min(100%, 440px); justify-self: center; border-radius: 50%; background: linear-gradient(145deg, var(--steel-a), var(--steel-b)); box-shadow: 0 16px 44px var(--shadow), inset 0 0 0 1px var(--line); padding: 3.5%; }
.disc-clip { position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; }
.disc { position: relative; width: 100%; height: 100%; border-radius: 50%; animation: spin 16s linear infinite;
  background:
    radial-gradient(circle, transparent 0 40%, rgba(255, 255, 255, .22) 40.4% 41%, transparent 41.4%),
    radial-gradient(circle, transparent 0 69%, rgba(255, 255, 255, .25) 69.4% 70%, transparent 70.4%),
    conic-gradient(from 25deg, #e8f1ff, #a9d0ff, #ffc0e7, #fff0ae, #aeffdd, #a4c4ff, #f5bcff, #e8f1ff, #bce6ff, #ffcae5, #fff5c2, #befee6, #e8f1ff);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .7); }
.disc svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.disc text { fill: #0d1a3a; font-family: var(--f-tech); font-size: 6.6px; letter-spacing: .14em; }
.hub { position: absolute; inset: 37%; border-radius: 50%; background: radial-gradient(circle, var(--bg) 0 24%, #e9eff5 25% 30%, #c8d3de 31% 33%, rgba(255, 255, 255, .62) 34%); box-shadow: 0 0 0 1px rgba(13, 26, 58, .18); }
.year-chip { position: absolute; right: 0; bottom: 6%; padding: 6px 12px; }
.year-chip b { font-weight: 400; font-size: clamp(24px, 3.2vw, 34px); line-height: 1; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .disc { animation: none; } html { scroll-behavior: auto; } }

.lcd { background: var(--lcd); color: var(--lcd-ink); border-radius: 10px; padding: 12px 16px; box-shadow: inset 0 2px 6px rgba(6, 38, 79, .3), 0 0 0 1px var(--line); font-family: var(--f-lcd); }
.counts { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 18px; }
.counts div { display: flex; align-items: baseline; gap: 6px; }
.counts b { font-weight: 400; font-size: 26px; line-height: 1; }
.counts span { font-family: var(--f-body); font-size: 13px; }

.tracks { display: grid; grid-template-columns: repeat(var(--n, 13), minmax(0, 1fr)); gap: 5px; }
.tracks button, .pill { border: 1px solid var(--line); background: linear-gradient(180deg, var(--steel-a), var(--steel-b)); border-radius: 8px; cursor: pointer; color: var(--ink); }
.tracks button { padding: 6px 0 5px; text-align: center; line-height: 1.15; min-width: 0; }
.tracks small { display: block; font: 400 8.5px/1 var(--f-tech); color: var(--mute); letter-spacing: .08em; margin-bottom: 3px; }
.tracks b { font: 400 16px/1 var(--f-lcd); }
.tracks button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tracks button[aria-pressed="true"] small { color: inherit; }
.now { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 18px 34px; }
.now-head { display: grid; grid-template-columns: 200px auto minmax(0, 1fr) auto; gap: 8px 18px; align-items: center; }
.now-art { grid-row: span 2; width: 200px; height: 200px; border-radius: 3px; box-shadow: 0 4px 14px rgba(0, 0, 0, .4); }
.now-head .big { font-size: 42px; line-height: 1; }
.now-head h2 { font-size: 26px; }
.now-head p { margin: 4px 0 0; font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.now-stats { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 2px 22px; font-family: var(--f-body); font-size: 13px; }
.now-stats b { font: 400 22px/1 var(--f-lcd); }
.now-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 30px; align-items: start; }
.now-foot { display: flex; flex-wrap: wrap; gap: 6px; }
.now details { margin-top: 4px; }
.now summary { cursor: pointer; color: var(--accent); font-size: 14px; margin-bottom: 8px; }
.ev-scroll { max-height: 640px; overflow-y: auto; margin-top: 8px; padding-right: 10px; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.ev-scroll .mon:first-child { margin-top: 4px; }
.ed-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.ed-mini { padding: 11px 13px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); display: grid; gap: 4px; align-content: start; min-width: 0; }
.ed-mini h3 { font-size: 18px; }
.ed-mini h3 a { color: inherit; text-decoration: none; }
.ed-mini h3 a:hover { color: var(--accent); text-decoration: underline; }
.ed-mini h3 small { display: block; font: 400 12.5px/1.4 var(--f-body); color: var(--mute); }
.ed-mini .tech { margin: 2px 0 0; font-size: 9.5px; letter-spacing: .1em; }
.ed-mini ol { margin: 0; padding: 0 0 0 18px; font-size: 13.5px; line-height: 1.5; overflow-wrap: anywhere; }
.ed-mini .plays { margin: 4px 0 0; }

/* 十六年一览 */
.era { display: grid; gap: 7px; }
.era-row { display: grid; grid-template-columns: minmax(0, 1fr) 82px minmax(0, 1fr); gap: 7px; }
.era-head { margin-bottom: 6px; font: 400 18px/1.2 var(--f-display); text-align: center; }
.era-head b { font-weight: 400; color: var(--accent); }
.era-c { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: start; padding: 11px 13px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); text-decoration: none; min-width: 0; }
a.era-c:hover { border-color: var(--accent); }
.era-c img { width: 96px; height: 96px; border-radius: 2px; }
.era-c > span { display: grid; gap: 3px; min-width: 0; }
.era-c b { font: 400 19px/1.25 var(--f-display); }
.era-c small { color: var(--mute); font-size: 13.5px; line-height: 1.55; }
.era-c .tech { font-size: 9.5px; }
.era-c.none { grid-template-columns: minmax(0, 1fr); place-content: center; text-align: center; color: var(--mute); font-size: 13px; background: transparent; border-style: dashed; }
.era-y { font: 400 20px/1 var(--f-lcd); border: 1px solid var(--line); border-radius: 10px; background: linear-gradient(180deg, var(--steel-a), var(--steel-b)); color: var(--ink); cursor: pointer; }
.era-y:hover { border-color: var(--accent); color: var(--accent); }

/* 榜单连播台 */
table.board { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 13.5px; }
.board th, .board td { padding: 4px; border-bottom: 1px solid var(--line); text-align: center; }
.board thead th { font-weight: 400; color: var(--mute); }
.board tbody th, .board thead th:first-child { position: sticky; left: 0; z-index: 1; min-width: 150px; max-width: 200px; text-align: left; padding-left: 12px; font-weight: 500; line-height: 1.3; background: var(--panel); }
.board tbody th a { color: inherit; text-decoration: none; }
.board tbody th a:hover { color: var(--accent); text-decoration: underline; }
.cell { display: block; min-width: 30px; padding: 3px 0; border-radius: 6px; background: var(--hot); color: #fff; font: 400 13.5px/1.3 var(--f-lcd); text-decoration: none; }
:root[data-theme="dark"] .cell { color: #1a0312; }
.cell:hover { filter: brightness(1.12); }
.chart-card > a { display: grid; gap: 6px; color: inherit; text-decoration: none; }
.chart-card > a:hover h3 { color: var(--accent); }
.chart-card p { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }
.chart-card .plays { margin: 2px 0 0; align-items: center; }
.whole { display: grid; gap: 4px; margin: 14px 0 10px; font-family: var(--f-body); font-size: 13.5px; }
.whole b { font: 400 21px/1.2 var(--f-display); }
.whole .plays { margin: 6px 0 0; }
.sec-h .plays { margin: 0; }
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* 段落结构 */
.sec { padding-block: 26px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
.sec-h h2 { font-size: 30px; }
.page-h { padding-block: 30px 12px; }
.page-h h1 { font-size: clamp(38px, 6vw, 68px); }
.page-h p { max-width: 42em; margin: 8px 0 0; color: var(--mute); }
.prose { max-width: 42em; }
.prose p { margin: 0 0 1em; }
.more { color: var(--accent); font-size: 14px; }

/* CD 盒 */
.case { position: relative; display: block; aspect-ratio: 1; width: 100%; background: var(--hinge); overflow: hidden; border-radius: 2px; box-shadow: 0 3px 10px var(--shadow), 0 0 0 1px rgba(13, 26, 58, .2); }
.case img, .case .blank { position: absolute; left: 7%; top: 0; width: 93%; height: 100%; object-fit: cover; }
.case::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, rgba(255, 255, 255, .26) 0 22%, rgba(255, 255, 255, 0) 23% 100%); pointer-events: none; }
.blank { display: grid; place-items: center; padding: 10%; text-align: center; font: 400 clamp(13px, 2vw, 20px)/1.2 var(--f-display); color: #fff; overflow-wrap: anywhere; }
.albums { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 16px; }
.albums.tight { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 16px 12px; }
.alb { color: var(--ink); text-decoration: none; display: grid; gap: 7px; min-width: 0; align-content: start; }
.alb .case { transition: transform .16s ease; }
.alb:hover .case { transform: translateY(-3px); }
.alb b { display: block; font-weight: 600; font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; }
.alb small { display: block; color: var(--mute); font-size: 12.5px; line-height: 1.4; }

/* 点歌行 */
.tune { list-style: none; margin: 0; padding: 0; }
.tune li { display: grid; grid-template-columns: 76px minmax(0, 1.5fr) minmax(0, 1fr) 46px 44px 104px; gap: 10px; align-items: center; padding: 7px 4px; border-bottom: 1px solid var(--line); line-height: 1.35; }
.tune.short li { grid-template-columns: minmax(0, 1fr) 104px; }
.tune li:hover { background: var(--panel); }
.tune .no { font: 400 13px/1 var(--f-lcd); color: var(--mute); }
.tune .ti { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.tune .ti small { font-weight: 400; color: var(--mute); display: block; font-size: 12.5px; }
.tune .by { min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.tune .by a, .tune .ti a { color: inherit; text-decoration: none; }
.tune .by a:hover, .tune .ti a:hover { color: var(--accent); text-decoration: underline; }
.tune .yr { font: 400 14px/1 var(--f-lcd); }
.tune .lg { font-size: 12px; color: var(--mute); }
.play { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 5px 9px; border-radius: 999px; background: var(--hot); color: #fff; font-size: 12.5px; font-weight: 600; text-decoration: none; white-space: nowrap; line-height: 1.3; }
:root[data-theme="dark"] .play { color: #1a0312; }
.play::before { content: ""; width: 0; height: 0; border-style: solid; border-width: 4.5px 0 4.5px 7.5px; border-color: transparent transparent transparent currentColor; }
.play.alt { background: transparent; color: var(--hot); box-shadow: inset 0 0 0 1px var(--hot); }
.play:hover { filter: brightness(1.12); }

/* 筛选 */
.filters { display: grid; gap: 8px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 16px; }
.frow { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.frow > .tech { min-width: 58px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 11px; cursor: pointer; font-size: 13.5px; color: var(--ink); line-height: 1.6; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.listing { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; color: var(--mute); font-size: 13.5px; }
.pager { display: flex; justify-content: center; align-items: center; gap: 12px; padding-block: 18px; }
.pill { padding: 6px 15px; }
.pill[disabled] { opacity: .45; cursor: default; }
.pill.go { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* 歌手 */
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 12px; }
.who { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: center; color: var(--ink); text-decoration: none; padding: 8px; border-radius: 8px; border: 1px solid transparent; }
.who:hover { background: var(--panel); border-color: var(--line); }
.who b { display: block; font-size: 15.5px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.who small { display: block; color: var(--mute); font-size: 12.5px; line-height: 1.35; overflow-wrap: anywhere; }
.face { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; background: linear-gradient(135deg, var(--accent), var(--hot)); color: #fff; display: grid; place-items: center; font: 400 22px/1 var(--f-display); flex: none; }
.face img { width: 100%; height: 100%; object-fit: cover; }
.letter { font: 400 22px/1 var(--f-tech); color: var(--accent); padding-block: 14px 8px; }

/* 词条 */
.entry { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; align-items: start; padding-block: 26px; }
.entry-h h1 { font-size: clamp(40px, 6.6vw, 74px); }
.entry-h .sub { color: var(--mute); margin-top: 6px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; position: sticky; top: 78px; }
.box dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 12px; font-size: 14px; line-height: 1.45; }
.box dt { color: var(--mute); white-space: nowrap; }
.box dd { margin: 0; overflow-wrap: anywhere; }
.box .links { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13.5px; }
.portrait { aspect-ratio: 1; width: 100%; object-fit: cover; object-position: 50% 20%; border-radius: 6px; }
.credit { font-size: 11.5px; color: var(--mute); line-height: 1.4; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.tag { font-size: 12.5px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--mute); text-decoration: none; }
a.tag:hover, button.tag:hover { border-color: var(--accent); color: var(--accent); }
button.tag { background: transparent; cursor: pointer; }
.tracklist { list-style: none; margin: 0; padding: 0; }
.tracklist li { display: grid; grid-template-columns: 30px minmax(0, 1fr) 50px 104px; gap: 8px; align-items: center; padding: 6px 2px; border-bottom: 1px solid var(--line); line-height: 1.35; }

<script>(() => {
  const D = window.DATA;
  const view = document.getElementById('view');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const by = (list, key) => Object.fromEntries(list.map(x => [x[key], x]));
  const group = (list, fn) => list.reduce((m, x) => ((m[fn(x)] ??= []).push(x), m), {});
  const fmt = n => n.toLocaleString('zh-CN');

  D.artists.forEach(a => { a.photo = window.FACES?.[a.id]; });
  const artists = by(D.artists, 'id');
  // 没有简介的表演者不进歌手库，歌曲和搜索里仍然找得到
  const listed = D.artists.filter(a => !a.thin);
  const albums = by(D.albums, 'id');
  const songs = by(D.songs, 'id');
  const albumsOf = group(D.albums, b => b.a);
  const songsOf = group(D.songs, s => s.a);
  const songsIn = group(D.songs, s => s.al);
  const albumsAt = group(D.albums, b => b.y);
  const songsAt = group(D.songs, s => s.y);
  const YEARS = D.years.map(y => y.y);
  const LINES = { hktw: '港台线', cn: '内地线' };
  const lineOfRegion = r => (r === '内地' ? 'cn' : 'hktw');
  const lineOfArtist = id => lineOfRegion(artists[id]?.region);
  const yearsOf = l => D.years.filter(y => y[l]);
  const spanOf = l => { const v = yearsOf(l); return `${v[0]?.y}—${v[v.length - 1]?.y}`; };

  const ytSearch = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
  const musicSearch = q => 'https://music.youtube.com/search?q=' + encodeURIComponent(q);
  const ytUrl = s => {
    if (!s.vid) return musicSearch(`${artistName(s)} ${s.t}`);
    return (s.vk === '音频' ? 'https://music.youtube.com/watch?v=' : 'https://www.youtube.com/watch?v=') + s.vid;
  };
  const artistName = s => artists[s.a]?.tw ?? '';
  // 禁止嵌入的视频只能去 YouTube 看，不进站内队列
  const canEmbed = s => s.vid && !s.ne;
  const playLink = (s, label) => {
    const text = label ?? (s.vk || (s.vid ? '视频' : '搜索'));
    if (canEmbed(s)) return `<a class="play" href="${esc(ytUrl(s))}" target="_blank" rel="noopener" data-vid="${s.vid}" aria-label="播放 ${esc(artists[s.a]?.zh)}《${esc(s.t)}》">${esc(text)}</a>`;
    const where = !s.vid || s.vk === '音频' ? 'YouTube Music' : 'YouTube';
    return `<a class="play" href="${esc(ytUrl(s))}" target="_blank" rel="noopener" aria-label="在 ${where} 打开 ${esc(artists[s.a]?.zh)}《${esc(s.t)}》">${esc(text)}</a>`;
  };
  // YouTube 的临时歌单链接一次最多 50 首，超过就拆成几段
  const LIST_MAX = 50;
  const listUrl = vids => `https://www.youtube.com/watch_videos?video_ids=${vids.join(',')}`;
  const vidsOf = list => [...new Set(list.map(x => (x.vid ? x : songs[x.id])).filter(s => s && canEmbed(s)).map(s => s.vid))];
  const slices = list => { const parts = []; for (let i = 0; i < list.length; i += LIST_MAX) parts.push(list.slice(i, i + LIST_MAX)); return parts; };
  const ytList = (vids, text) => `<a class="play alt" href="${listUrl(vids)}" target="_blank" rel="noopener">${esc(text)}</a>`;
  // 站内连播不限首数，按住 Ctrl 点击时打开前 50 首的 YouTube 临时歌单
  const playLinkAll = (vids, text, mode) => `<a class="play${mode ? ' alt' : ''}" href="${listUrl(vids.slice(0, LIST_MAX))}" target="_blank" rel="noopener" data-vids="${vids.join(',')}"${mode ? ` data-mode="${mode}"` : ''}>${esc(text)}</a>`;
  const playAll = (list, name = '连播') => {
    const vids = vidsOf(list);
    if (vids.length < 2) return '';
    return `<div class="plays">${playLinkAll(vids, `${name} ${vids.length} 首`)}${vids.length > 9 ? playLinkAll(vids, '随机', 'shuffle') : ''}</div>`;
  };
  const editionSongs = e => e.groups.flatMap(g => g.items.filter(it => it.id));
  const editionsAt = (yr, l) => D.charts.filter(c => c.track === l).flatMap(c => c.editions.filter(e => e.y === yr).map(e => [c, e]));
  // 整榜按年份串起来，同一首歌只放一次，分段时标出每段的年份
  const chartRuns = c => {
    const seen = new Set(), run = [];
    for (const e of c.editions.slice().sort((x, y) => x.y - y.y)) for (const v of vidsOf(editionSongs(e))) if (!seen.has(v)) { seen.add(v); run.push([v, e.y]); }
    const parts = slices(run);
    return parts.map(p => {
      const [from, to] = [p[0][1], p[p.length - 1][1]];
      return { vids: p.map(x => x[0]), text: parts.length === 1 ? `连播全榜 ${p.length} 首` : `${from === to ? from : `${from}—${to}`} · ${p.length} 首` };
    });
  };
  const artistLink = id => artists[id] ? `<a href="#a-${id}">${esc(artists[id].zh)}</a>` : '';
  const creditOf = s => (s.by ?? [s.a]).map(artistLink).join(' / ') + (s.feat ? ` feat. ${esc(s.feat)}` : '');

  const coverHue = id => [...id].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
  const blankCover = b => `<span class="blank" style="background:linear-gradient(135deg,hsl(${coverHue(b.id)} 70% 38%),hsl(${(coverHue(b.id) + 70) % 360} 72% 46%))">${esc(b.t)}</span>`;

  // 封面加载失败时换成色块封面，不露出破图标
  document.addEventListener('error', e => {
    const b = albums[e.target.dataset?.album];

    else if (e.target.dataset?.title) e.target.outerHTML = blankCover({ id: e.target.dataset.title, t: e.target.dataset.title });

  // 年度和专题的封面插画，文件缺失时直接隐藏
  const artImg = (id, cls = '') => `<img class="art ${cls}" src="art/${id}.webp" data-art="${id}" alt="" loading="lazy" width="800" height="800">`;

  const tuneList = (list, short) => `<ul class="tune${short ? ' short' : ''}">${list.map(short ? tuneShort : tuneRow).join('')}</ul>`;

  const sample = (list, n, seed = Date.now()) => {
    const a = list.slice();
    let r = seed % 2147483647 || 1;
    for (let i = a.length - 1; i > 0; i--) { r = r * 48271 % 2147483647; const j = r % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }

  };
  const heavy = list => list.slice().sort((x, y) => (y.star ?? 0) - (x.star ?? 0));

  /* 首页 */
  let line = 'hktw';
  let track = 2000;
  const songRow = (x, i) => {

    if (s) return `<li>${rank}<span class="ti">${s.al && albums[s.al] ? `<a href="#b-${s.al}">${esc(s.t)}</a>` : esc(s.t)}${x.why || x.n ? `<small>${esc(x.why || x.n)}</small>` : ''}</span><span class="by">${creditOf(s)}</span><span class="yr">${x.y ?? s.y}</span><span class="act">${playLink(x.vid ? { ...s, vid: x.vid, vk: '现场', ne: 0 } : s)}</span></li>`;
    return `<li>${rank}<span class="ti">${esc(x.t)}${x.why || x.n ? `<small>${esc(x.why || x.n)}</small>` : ''}</span><span class="by">${esc(x.a)}</span><span class="yr">${x.y ?? ''}</span><span class="act">${x.vid ? playLink({ vid: x.vid, t: x.t, vk: '现场' }) : `<a class="play alt" href="${esc(musicSearch(`${x.a} ${x.t}`))}" target="_blank" rel="noopener">搜索</a>`}</span></li>`;

  const songRows = (list, ranked) => `<ul class="tune wide">${list.map((x, i) => songRow(x, ranked ? i : null)).join('')}</ul>`;
  const lineBar = (cur, href) => `<div class="linebar" role="group" aria-label="选择线路">${Object.entries(LINES).map(([k, v]) => `<a class="chip" aria-pressed="${k === cur}" href="${href(k)}">${v}<small>${spanOf(k)}</small></a>`).join('')}</div>`;
  const renderNow = () => {
    const box = document.getElementById('now');

    document.getElementById('tracks').innerHTML = list.map((v, i) => `<button type="button" data-y="${v.y}" aria-pressed="${v.y === track}" aria-label="${v.y} 年"><small>TR${String(i + 1).padStart(2, '0')}</small><b>${String(v.y).slice(2)}</b></button>`).join('');
    document.getElementById('tracks').style.setProperty('--n', list.length);
    document.querySelectorAll('[data-line]').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.line === line)));
    document.getElementById('hub').textContent = track;
    const v = D.years.find(x => x.y === track), y = v[line], other = line === 'cn' ? 'hktw' : 'cn';
    const idx = list.findIndex(x => x.y === track) + 1;
    const bs = heavy((albumsAt[track] ?? []).filter(b => lineOfArtist(b.a) === line));
    const spare = y.albums.filter(x => !x.id && !bs.some(b => b.t === x.t));
    const shelf = [...bs.map(albumCard), ...spare.filter(x => x.cover).map(x => spareCard(x, track))];
    const plain = spare.filter(x => !x.cover);

    const lore = D.topics.map(t => [t, t.timeline.filter(e => String(e.d ?? '').startsWith(track)).length]).filter(([t, n]) => n && (t.track === line || t.track === 'all')).sort((a, b) => b[1] - a[1]).slice(0, 3);

        <a class="more" style="color:inherit" href="#y${track}-${line}">整页阅读 →</a>
        <div class="now-stats">
          <span><b>${y.events.length}</b> 条大事</span><span><b>${bs.length + spare.length}</b> 张专辑</span><span><b>${y.songs.length}</b> 首歌</span><span><b>${eds.length}</b> 届榜单</span>
        </div>
      </div>
      <div class="now-grid">

          <div class="sec-h"><h2>这一年发生了什么</h2><span class="tech">Overview</span></div>

          ${y.overview.length > 3 ? `<details class="prose"><summary>继续读，还有 ${y.overview.length - 3} 段</summary>${y.overview.slice(3).map(p => `<p>${esc(p)}</p>`).join('')}</details>` : ''}
        </section>
        <section>
          <div class="sec-h"><h2>大事记</h2><span class="tech">${y.events.length} Events</span></div>
          <div class="frow">${cats.map(c => `<button type="button" class="chip" data-cat="${esc(c)}" aria-pressed="${c === '全部'}">${esc(c)}</button>`).join('')}</div>

        </section>
      </div>
      <section>
        <div class="sec-h"><h2>当年专辑</h2><a class="more" href="#y${track}-${line}">全部 ${bs.length + spare.length} 张</a></div>
        ${shelf.length ? `<div class="albums tight">${shelf.slice(0, 18).join('')}</div>` : ''}
        ${shelf.length < 12 ? `<ul class="alist">${plain.slice(0, 12 - shelf.length).map(x => `<li><time>${esc(String(x.d ?? '').slice(5))}</time><span class="ti">《${esc(x.t)}》${x.n ? `<small>${esc(x.n)}</small>` : ''}</span><span class="by">${esc(x.a)}</span></li>`).join('')}</ul>` : ''}
      </section>
      <div class="now-grid">

          ${playAll(y.songs)}

        </section>

        </section>
      </div>
      ${lore.length || v[other] ? `<div class="now-foot">
        ${v[other] ? `<button type="button" class="pill" data-to="${other}">同年${LINES[other]}：${esc(v[other].title)}</button>` : ''}
        ${lore.map(([t]) => `<a class="pill" href="#t-${t.id}">专题：${esc(t.title)}</a>`).join('')}
      </div>` : ''}`;
    document.getElementById('home-board').innerHTML = chartBoard(D.charts.filter(c => c.track === line));
  };
  // 首页的榜单卡片：列出第一个有歌的奖项，下面放本届连播
  const edMini = (c, e) => {
    const g = e.groups.find(x => x.items.some(it => it.id)) ?? e.groups[0];
    return `<article class="ed-mini">
      <h3><a href="#c-${c.id}">${esc(c.name)}</a><small>${esc(e.title ?? '')}</small></h3>
      ${g ? `<p class="tech">${esc(g.award)}</p><ol>${g.items.slice(0, 3).map(it => `<li>${it.t ? `《${esc(it.t)}》` : ''}${esc(it.a)}</li>`).join('')}</ol>` : ''}
      ${playAll(editionSongs(e), '连播本届')}
    </article>`;
  };
  const eraRow = v => {
    const cell = l => (v[l] ? `<a class="era-c" href="#y${v.y}-${l}">${artImg(`y${v.y}-${l}`)}<span><b>${esc(v[l].title)}</b><small>${esc(v[l].lead)}</small><span class="tech">${v[l].events.length} 条大事 · ${v[l].songs.length} 首歌</span></span></a>` : `<span class="era-c none">${LINES[l]}讲到 ${yearsOf(l).at(-1).y} 年</span>`);
    return `<div class="era-row">${cell('hktw')}<button type="button" class="era-y" data-y="${v.y}" aria-label="在上方查看 ${v.y} 年">${v.y}</button>${cell('cn')}</div>`;
  };
  const home = () => {
    view.innerHTML = `
      <section class="wrap player">
        <div>
          <p class="tech">Mandopop &amp; Cantopop Encyclopedia · 1997—2012</p>
          <h1><span>千禧年</span><span><em>华语音乐</em></span><span>大百科</span></h1>
          <p class="lede">内地和港台走的不是同一条时间线，所以这里分成两条来讲：港台线从陶喆到周杰伦，内地线从校园民谣之后到彩铃神曲。逐年大事、历届榜单和歌单都在这里，点一下就在页面里播放，翻到别的页面也不会断。</p>
          <div class="lcd counts">
            <div><b>${fmt(listed.length)}</b><span>组歌手</span></div>
            <div><b>${fmt(D.albums.length)}</b><span>张专辑</span></div>
            <div><b>${fmt(D.songs.length)}</b><span>首歌</span></div>
            <div><b>${fmt(D.charts.reduce((n, c) => n + c.editions.length, 0))}</b><span>届榜单</span></div>
          </div>
          <div class="plays hero-play"><a class="play big" href="#songs" data-all>随机听全站</a></div>
        </div>
        <div class="disc-box" aria-hidden="true">
          <div class="disc-clip"><div class="disc">
            <svg viewBox="0 0 200 200"><defs><path id="ring" d="M100 100m-84 0a84 84 0 1 1 168 0a84 84 0 1 1-168 0"/></defs>
              <text><textPath href="#ring">MILLENNIUM MANDOPOP · COMPACT DISC DIGITAL AUDIO · TWO LINES · ONE ERA ·</textPath></text></svg>
          </div><div class="hub"></div></div>
          <div class="lcd year-chip"><b id="hub">${track}</b></div>
        </div>
      </section>
      <section class="wrap">
        <div class="frow" style="margin-bottom:8px"><span class="tech">选一条线</span>${Object.entries(LINES).map(([k, v]) => `<button type="button" class="chip" data-line="${k}">${v}</button>`).join('')}<span class="tech">每一轨是一个年份</span></div>
        <div class="tracks" id="tracks"></div>
      </section>
      <p class="vh" id="now-say" aria-live="polite"></p>
      <section class="wrap now" id="now"></section>

        <div class="sec-h"><h2>十六年一览</h2><span class="tech">1997—2012</span></div>
        <div class="era-row era-head" aria-hidden="true"><b>港台线</b><span></span><b>内地线</b></div>
        <div class="era" id="era">${D.years.map(eraRow).join('')}</div>
      </section>
      <section class="wrap sec">
        <div class="sec-h"><h2>榜单连播台</h2><a class="more" href="#charts">全部榜单</a></div>
        <div id="home-board"></div>
      </section>
      <section class="wrap sec">
        <div class="sec-h"><h2>随机点歌</h2><span class="tech">Shuffle</span></div>
        <div class="shuffle" id="shuffle"></div>
      </section>

        <div class="sec-h"><h2>专题</h2><a class="more" href="#topics">全部专题</a></div>
        <div class="cards">${D.topics.slice(0, 9).map(topicCard).join('')}</div>
      </section>`;
    document.getElementById('tracks').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { track = +b.dataset.y; renderNow(); } });
    view.querySelectorAll('[data-line]').forEach(c => c.addEventListener('click', () => { line = c.dataset.line; renderNow(); }));
    document.getElementById('now').addEventListener('click', e => {

        view.querySelectorAll('#now [data-cat]').forEach(x => x.setAttribute('aria-pressed', String(x === c)));
        document.getElementById('now-ev').innerHTML = eventsHtml(D.years.find(v => v.y === track)[line].events, c.dataset.cat);

  };
  const shuffle = () => {

    if (!box) return;
    const pool = D.songs.filter(s => s.vid);
    const list = pool.length ? pool : D.songs;
    const s = list[Math.floor(Math.random() * list.length)];
    box.innerHTML = `${s.al ? `<a href="#b-${s.al}" aria-label="查看专辑">${cover(albums[s.al])}</a>` : '<span></span>'}
      <div><b>${esc(s.t)}</b><small>${creditOf(s)} · ${s.y}${s.al ? ` · 《${esc(albums[s.al].t)}》` : s.alt ? ` · 《${esc(s.alt)}》` : ''}</small></div>
      <div class="shuffle-act">${playLink(s, '播放这首')}<button class="pill" type="button" id="reroll">换一首</button></div>`;
    document.getElementById('reroll').addEventListener('click', shuffle);
  };

  /* 年表 */
  const srcLink = s => {
    if (!s) return '';
    if (s.startsWith('bili:')) return ` <a class="src" href="https://www.bilibili.com/video/${esc(s.slice(5))}" target="_blank" rel="noopener">B站</a>`;
    if (s.startsWith('wiki:')) return ' <span class="src">维基</span>';
    if (/^https?:/.test(s)) { let host = '来源'; try { host = new URL(s).hostname.replace(/^www\./, '').split('.').slice(-2, -1)[0]; } catch {} return ` <a class="src" href="${esc(s)}" target="_blank" rel="noopener">${esc(host)}</a>`; }
    return '';
  };
  const yearCard = (v, l) => {
    const y = v[l];
    return `<a class="ycard" href="#y${v.y}-${l}">${artImg(`y${v.y}-${l}`)}<span class="yb"><b>${esc(y.title)}</b><small>${esc(y.lead)}</small><span class="tech">${y.events.length} 条大事 · ${y.albums.length} 张专辑 · ${y.songs.length} 首歌</span></span></a>`;
  };
  const years = l => {
    view.innerHTML = `
      <header class="wrap page-h"><h1>编年史</h1><p>内地和港台的节奏不同，这里分成两条线。港台线的主轴是唱片工业的高峰和转型，内地线一直讲到 2012 年彩铃和网络歌曲时代收束。</p>

  const monthOf = d => +String(d ?? '').slice(5, 7) || 0;
  const eventsHtml = (list, cat) => {

    return Object.keys(by).map(Number).sort((a, b) => (a || 99) - (b || 99)).map(m => `<h3 class="mon">${MONTHS[m]}</h3><ul class="events">${by[m].map(e => `<li><time>${esc(String(e.d ?? '').slice(5) || '—')}</time><span><span class="tag">${esc(e.c)}</span> ${esc(e.t)}${srcLink(e.s)}</span></li>`).join('')}</ul>`).join('') || '<p class="prose">这个分类下没有条目。</p>';
  };
  // 只有一个奖项有歌时，本届连播已经包含它，不重复放按钮
  const groupsHtml = e => {
    const all = vidsOf(editionSongs(e)).length;

  };
  // 歌多的专题按年分组，每年单独连播
  const topicSongs = t => {
    if (t.songs.length < 100) return playAll(t.songs) + songRows(t.songs);
    const byYear = group(t.songs, s => s.y);
    const ys = Object.keys(byYear).sort();
    return `${playAll(t.songs)}<div class="jump">${ys.map(y => `<button type="button" class="tag lcdnum" data-go="sy-${y}">${y}</button>`).join('')}</div>${ys.map(y => `<h3 class="mon" id="sy-${y}">${y} 年 · ${byYear[y].length} 首</h3>${playAll(byYear[y], '连播本届')}${songRows(byYear[y])}`).join('')}`;
  };
  const topicPage = id => {
    const t = D.topics.find(x => x.id === id);
    if (!t) return notFound();
    view.innerHTML = `<div class="wrap">
      <header class="page-h"><p class="tech" style="margin:0"><a href="#topics">专题</a> / ${esc(t.kicker ?? '')} / ${trackName[t.track] ?? ''}</p><div class="year-big">${artImg(`t-${t.id}`)}<div><h1>${esc(t.title)}</h1><p>${esc(t.summary)}</p></div></div>
        <div class="jump">${t.body.filter(s => s.h).map((s, i) => `<button type="button" class="chip" data-go="s${i}">${esc(s.h)}</button>`).join('')}${t.songs.length ? '<button type="button" class="chip" data-go="sec-songs">歌单</button>' : ''}</div></header>
      <div class="prose">${t.body.map((s, i) => `${s.h ? `<h2 class="sub" id="s${i}">${esc(s.h)}</h2>` : ''}${(s.p ?? []).map(p => `<p>${esc(p)}</p>`).join('')}`).join('')}</div>
      ${t.timeline.length ? `<section class="sec"><div class="sec-h"><h2>时间线</h2></div><ul class="events">${t.timeline.map(e => `<li><time>${esc(String(e.d ?? '').slice(0, 7))}</time><span>${esc(e.text)}${srcLink(e.src)}</span></li>`).join('')}</ul></section>` : ''}
      ${t.people.length ? `<section class="sec"><div class="sec-h"><h2>关键人物</h2></div><div class="cards">${t.people.map(p => `<article class="card"><span class="tech">${esc(p.role ?? '')}</span><h3>${esc(p.name)}</h3><p>${esc(p.text ?? '')}</p></article>`).join('')}</div></section>` : ''}
      ${t.songs.length ? `<section class="sec" id="sec-songs"><div class="sec-h"><h2>听这些歌</h2><span class="tech">${t.songs.length} Songs</span></div>${topicSongs(t)}</section>` : ''}
      ${t.sources.length ? `<section class="sec"><div class="sec-h"><h2>资料来源</h2></div><ul class="prose">${t.sources.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('')}</ul></section>` : ''}
    </div>`;
    view.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => document.getElementById(b.dataset.go)?.scrollIntoView({ behavior: 'smooth' })));
  };

  /* 幕后 */
  const makersView = () => {
    view.innerHTML = `<header class="wrap page-h"><h1>幕后</h1><p>写词、作曲、制作和开厂牌的人。千禧年的华语歌，很多都出自这些名字。</p></header>
      <div class="wrap"><div class="cards">${D.makers.map(m => `<article class="card"><span class="tech">${esc(m.role)}</span><h3>${esc(m.name)}</h3><p>${esc(m.blurb)}</p>${m.url ? `<p><a href="${esc(m.url)}" target="_blank" rel="noopener">维基百科</a></p>` : ''}</article>`).join('')}</div></div>`;
  };

  /* 关于 */
  const aboutView = () => {
    const m = D.meta;
    view.innerHTML = `<div class="wrap">
      <header class="page-h"><h1>关于本站</h1></header>
      <div class="prose">
        <p>这是一个非官方的粉丝向音乐资料站。编年史分内地和港台两条线，因为两地的时间节奏不同。B 站纪录片字幕和播客只作线索，事实以其他来源核对为准，评价类内容不当作事实收录。站内文字为本站整理撰写，不收录歌词。音频和视频都不存放在站内，歌曲通过 YouTube 官方嵌入播放器在页面里播放。点播放之后才会加载播放器，这时 YouTube 会收到你的访问信息。</p>
        <p><b>收录范围：</b>港台线 1997 至 2009 年，内地线 1997 至 2012 年，覆盖台湾、香港、内地、新加坡和马来西亚。这是一份编辑精选，不是完整目录。</p>
        <p><b>视频链接：</b>${fmt(m.linked)} 首歌链接到具体的视频或音频，其中 ${fmt(m.official)} 条来自官方、唱片公司频道或 YouTube 官方音频。优先顺序是官方 MV、高播放量的原版 MV、官方音频，最后才是现场版。每条都在 ${esc(m.checked)} 用 YouTube oEmbed 确认过存在。春晚专题优先用 CCTV春晚 官方频道的当届片段。其余歌曲和专辑里的非主打曲目使用 YouTube Music 搜索链接。部分视频有地区限制，打不开时可以用专辑页的搜索链接。</p>
        <p><b>封面与资料：</b>专辑封面、曲目和发行信息取自 iTunes Search API，首发日期参考 MusicBrainz，其中 ${fmt(m.wikiDates)} 张重点专辑的日期再用维基百科校对过。封面版权归各唱片公司所有，这里以缩略图用于资料说明。歌手照片取自维基共享资源，署名见各词条。</p>
        <p><b>奖项：</b>金曲奖名单整理自维基百科各届条目。</p>
        <p><b>已知局限：</b>iTunes 上缺货的专辑没有封面，用色块代替。曲目来自流媒体版本，可能与原版 CD 有出入。年份以首发为准。约三分之一的链接来自非官方上传，经过规则过滤和抽查，但仍可能有少量挂错版本。部分年份的台湾当年报道和销量数据没有查到，个别事件只有单一来源，每条大事都标了来源，可以点开核对。站内连播不限首数，遇到禁止嵌入的视频会自动跳过；跳去 YouTube 的临时歌单一次最多 50 首。手机浏览器切到后台时可能暂停。</p>
      </div>
      <section class="sec"><div class="sec-h"><h2>主要数据来源</h2></div>
        <ul class="prose">${m.sources.map(s => `<li><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join('')}</ul>
      </section>
    </div>`;
  };

  const notFound = () => { view.innerHTML = `<div class="wrap page-h"><h1>没有这个条目</h1><p><a href="#home">回到首页</a></p></div>`; };

  /* 全站搜索 */
  const index = [
    ...D.artists.map(a => ({ k: `${a.zh} ${a.tw} ${a.en}`.toLowerCase(), href: `#a-${a.id}`, name: a.zh, sub: `${a.en} · ${a.kind}`, mark: '歌手', icon: face(a), rank: 0 })),
    ...D.albums.map(b => ({ k: `${b.t} ${b.tt ?? ''} ${artists[b.a]?.zh} ${artists[b.a]?.tw}`.toLowerCase(), key2: `${b.t} ${b.tt ?? ''}`.toLowerCase(), href: `#b-${b.id}`, name: b.t, sub: `${artists[b.a]?.zh} · ${b.y}`, mark: '专辑', icon: cover(b), rank: 1 })),
    ...D.songs.map(s => ({ k: `${s.t} ${s.tw ?? ''} ${artists[s.a]?.zh} ${artists[s.a]?.tw} ${artists[s.a]?.en}`.toLowerCase(), key2: `${s.t} ${s.tw ?? ''}`.toLowerCase(), href: s.al ? `#b-${s.al}` : `#a-${s.a}`, ext: ytUrl(s), name: s.t, sub: `${artists[s.a]?.zh} · ${s.y}`, mark: '歌曲', icon: `<span class="lcdnum">${String(s.y).slice(2)}</span>`, rank: 2 })),
  ];
  const q = document.getElementById('q');
  const res = document.getElementById('results');
  const lookup = term => {
    const parts = term.toLowerCase().trim().split(/\s+/);
    const hits = index.filter(x => parts.every(p => x.k.includes(p)));
    const score = x => x.rank * 2 - ((x.key2 ?? x.k).startsWith(parts[0]) ? 3 : 0);
    return hits.sort((x, y) => score(x) - score(y)).slice(0, 14);
  };
  const close = () => { res.hidden = true; };
  q.addEventListener('input', () => {
    const term = q.value.trim();
    if (!term) return close();
    const hits = lookup(term);
    res.innerHTML = hits.length
      ? hits.map(h => `<a href="${esc(h.ext ?? h.href)}"${h.ext ? ' target="_blank" rel="noopener"' : ''}>${h.icon}<span>${esc(h.name)}<small>${esc(h.sub)}</small></span><span class="tech">${h.mark}</span></a>`).join('')
      : `<div class="none">没有找到“${esc(term)}”。可以试试歌手名或歌名，繁简都能搜。</div>`;
    res.hidden = false;
  });
  q.addEventListener('keydown', e => {
    if (e.key === 'Escape') { close(); q.blur(); }
    if (e.key === 'Enter') { const a = res.querySelector('a'); if (a) a.click(); }
  });
  res.addEventListener('click', () => { close(); q.value = ''; });
  document.addEventListener('click', e => { if (!e.target.closest('.search')) close(); });

  /* 路由 */
  const NAV = { home: '#home', years: '#years', artists: '#artists', albums: '#albums', songs: '#songs', charts: '#charts', topics: '#topics', makers: '#makers', about: '#about' };
  /* 站内播放器。切页不刷新，音乐不会断。YouTube 官方接口会报告播完和禁止嵌入，连播和跳过都靠这两个事件 */
  const byVid = new Map();
  D.songs.forEach(s => { if (canEmbed(s) && !byVid.has(s.vid)) byVid.set(s.vid, s); });
  D.topics.forEach(t => t.songs.forEach(x => { if (x.vid && !byVid.has(x.vid)) byVid.set(x.vid, x.id ? { ...songs[x.id], vid: x.vid, vk: '现场', ne: 0 } : { vid: x.vid, t: x.t, y: x.y, by: [], who: x.a }); }));
  const $ = id => document.getElementById(id);
  const dock = $('dock');
  const P = { yt: null, api: null, base: [], queue: [], pos: -1, shuffle: false, repeat: false, skips: 0, seeking: false };
  const bad = new Set();
  const ICON = { play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l14 8-14 8z"/></svg>', pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>' };
  const clock = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
  const nowSong = () => P.queue[P.pos];
  let toastTimer = 0;
  const toast = html => { const t = $('toast'); t.innerHTML = html; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 7000); };
  const outLink = (s, text) => `<a href="${esc(ytUrl(s))}" target="_blank" rel="noopener">${text}</a>`;
  const loadApi = () => (P.api ??= new Promise((ok, fail) => {
    window.onYouTubeIframeAPIReady = ok;
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = fail;
    document.head.append(tag);
    setTimeout(fail, 15000);
  }).catch(() => { P.api = null; throw new Error('blocked'); }));
  const markNow = () => {
    const v = dock.hidden ? null : nowSong()?.vid;
    document.querySelectorAll('a[data-vid]').forEach(a => a.classList.toggle('on', a.dataset.vid === v));
  };
  const paintQueue = () => {
    const from = Math.max(0, P.pos - 20);
    const box = $('dock-queue');
    box.innerHTML = `<ol start="${from + 1}">${P.queue.slice(from, from + 200).map((s, i) => `<li><button type="button" data-q="${from + i}"${from + i === P.pos ? ' aria-current="true"' : ''}><b>${esc(s.t)}</b><small>${esc(artists[s.a]?.zh)} · ${s.y}</small></button></li>`).join('')}</ol>`;
    box.querySelector('[aria-current]')?.scrollIntoView({ block: 'nearest' });
  };
  const paint = () => {
    const s = nowSong();
    if (!s) return;
    $('dock-no').textContent = `${String(P.pos + 1).padStart(3, '0')}/${String(P.queue.length).padStart(3, '0')}`;
    $('dock-title').textContent = s.t;
    $('dock-who').innerHTML = creditOf(s) || esc(s.who ?? '');
    const c = albums[s.al]?.cover;
    $('dock-disc').innerHTML = c ? `<img src="${esc(c)}" alt="">` : '';
    $('dk-out').href = ytUrl(s);
    if (!$('dock-queue').hidden) paintQueue();
    markNow();
  };
  const next = () => {
    if (P.pos + 1 < P.queue.length) playAt(P.pos + 1);
    else if (P.repeat) playAt(0);
    else toast('列表放完了。');
  };
  const onState = e => {
    if (e.data === YT.PlayerState.BUFFERING) return;
    const on = e.data === YT.PlayerState.PLAYING;
    dock.classList.toggle('spin', on);
    $('dk-play').innerHTML = on ? ICON.pause : ICON.play;
    $('dk-play').setAttribute('aria-label', on ? '暂停' : '播放');
    if (on) P.skips = 0;
    if (e.data === YT.PlayerState.ENDED) next();
  };
  const onError = e => {
    const s = nowSong();
    if (e.data === 153) return toast('当前环境不允许加载 YouTube 播放器。');
    bad.add(s.vid);
    if (++P.skips >= 5) return toast('连续 5 首都放不了，已停止，可能是所在地区或网络的限制。');
    toast(`《${esc(s.t)}》不能站内播放，已跳到下一首。${outLink(s, '去 YouTube 听')}`);
    next();
  };
  const playAt = async i => {
    P.pos = i;
    dock.hidden = false;
    document.body.classList.add('has-dock');
    paint();
    const { vid } = nowSong();
    try { await loadApi(); } catch { return toast(`连不上 YouTube，不能站内播放。${outLink(nowSong(), '在新窗口打开这首')}`); }
    if (P.yt?.loadVideoById) return P.yt.loadVideoById(vid);
    if (P.yt) return;
    P.yt = new YT.Player('yt-slot', {
      width: '100%', height: '100%', videoId: vid,
      playerVars: { autoplay: 1, playsinline: 1, rel: 0, origin: location.origin },
      events: {
        onReady: e => { if (nowSong()?.vid !== vid) e.target.loadVideoById(nowSong().vid); else e.target.playVideo(); },
        onStateChange: onState, onError,
        onAutoplayBlocked: () => toast('浏览器拦下了自动播放，按一下播放键就好。'),
      },
    });
  };
  const playList = (list, start = 0, mode) => {
    const clean = list.filter(s => s && !bad.has(s.vid));
    if (!clean.length) return;
    P.base = clean;
    P.shuffle = mode === 'shuffle';
    $('dk-shuffle').setAttribute('aria-pressed', String(P.shuffle));
    P.queue = P.shuffle ? sample(clean, clean.length) : clean.slice();
    playAt(P.shuffle ? 0 : Math.max(0, clean.indexOf(list[start])));
  };
  // 点歌：单首接着同一张列表往下放，连播按钮放整张列表。按住 Ctrl 点击仍然去 YouTube
  document.addEventListener('click', e => {
    const a = e.target.closest?.('a[data-vid], a[data-vids], a[data-all]');
    if (!a || e.ctrlKey || e.metaKey || e.shiftKey) return;
    e.preventDefault();
    if (a.dataset.all !== undefined) return playList([...byVid.values()], 0, 'shuffle');
    if (a.dataset.vids) return playList(a.dataset.vids.split(',').map(v => byVid.get(v)), 0, a.dataset.mode);
    if (!dock.hidden && nowSong()?.vid === a.dataset.vid) return $('dk-play').click();
    const box = a.closest('ul, ol');
    const links = box ? [...box.querySelectorAll('a[data-vid]')] : [a];
    const list = [...new Set(links.map(x => x.dataset.vid))].map(v => byVid.get(v));
    playList(list, list.indexOf(byVid.get(a.dataset.vid)));
  });
  $('dk-play').addEventListener('click', () => {
    if (!P.yt?.getPlayerState) return;
    if (P.yt.getPlayerState() === YT.PlayerState.PLAYING) P.yt.pauseVideo(); else P.yt.playVideo();
  });
  $('dk-next').addEventListener('click', next);
  $('dk-prev').addEventListener('click', () => { if (P.yt?.getCurrentTime?.() > 3) P.yt.seekTo(0, true); else playAt(Math.max(0, P.pos - 1)); });
  $('dk-shuffle').addEventListener('click', () => {
    const cur = nowSong();
    P.shuffle = !P.shuffle;
    $('dk-shuffle').setAttribute('aria-pressed', String(P.shuffle));
    P.queue = P.shuffle ? [cur, ...sample(P.base.filter(s => s !== cur), P.base.length)] : P.base.slice();
    P.pos = P.queue.indexOf(cur);
    paint();
  });
  $('dk-repeat').addEventListener('click', e => { P.repeat = !P.repeat; e.currentTarget.setAttribute('aria-pressed', String(P.repeat)); });
  $('dk-list').addEventListener('click', e => {
    const box = $('dock-queue');
    box.hidden = !box.hidden;
    e.currentTarget.setAttribute('aria-pressed', String(!box.hidden));
    if (!box.hidden) paintQueue();
  });
  $('dock-queue').addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (b) playAt(+b.dataset.q); });
  $('dk-size').addEventListener('click', e => { e.currentTarget.textContent = dock.classList.toggle('big') ? '小屏' : '大屏'; });
  $('dk-close').addEventListener('click', () => {
    P.yt?.stopVideo?.();
    dock.hidden = true;
    dock.classList.remove('spin');
    document.body.classList.remove('has-dock');
    markNow();
  });
  $('dk-vol').addEventListener('input', e => P.yt?.setVolume?.(+e.target.value));
  $('dk-seek').addEventListener('input', () => { P.seeking = true; });
  $('dk-seek').addEventListener('change', e => { P.seeking = false; P.yt?.seekTo?.((P.yt.getDuration() || 0) * e.target.value / 1000, true); });
  setInterval(() => {
    if (dock.hidden || P.seeking || !P.yt?.getDuration) return;
    const d = P.yt.getDuration() || 0, t = P.yt.getCurrentTime() || 0;
    $('dk-now').textContent = clock(t);
    $('dk-dur').textContent = clock(d);
    $('dk-seek').value = d ? Math.round(t / d * 1000) : 0;
  }, 500);
  $('dk-play').innerHTML = ICON.play;
  new MutationObserver(() => { if (!dock.hidden) requestAnimationFrame(markNow); }).observe(view, { childList: true, subtree: true });

  const route = () => {
    const h = (location.hash || '#home').slice(1);
    let nav = 'home';
    const yearHit = /^y(\d{4})(?:-(hktw|cn))?$/.exec(h);
    if (yearHit) { yearPage(+yearHit[1], yearHit[2] ?? 'hktw'); nav = 'years'; }
    else if (h === 'home' || h === '') home();
    else if (h === 'years' || h === 'years-hktw') { years('hktw'); nav = 'years'; }
    else if (h === 'years-cn') { years('cn'); nav = 'years'; }
    else if (h === 'artists') { artistsView(); nav = 'artists'; }
    else if (h === 'albums') { albumsView(); nav = 'albums'; }
    else if (h === 'songs') { songsView(); nav = 'songs'; }
    else if (h === 'charts' || h === 'charts-hktw' || h === 'awards') { chartsView('hktw'); nav = 'charts'; }
    else if (h === 'charts-cn') { chartsView('cn'); nav = 'charts'; }
    else if (h === 'topics') { topicsView(); nav = 'topics'; }
    else if (h === 'makers') { makersView(); nav = 'makers'; }
    else if (h === 'about') { aboutView(); nav = 'about'; }
    else if (h.startsWith('a-')) { artistPage(h.slice(2)); nav = 'artists'; }
    else if (h.startsWith('b-')) { albumPage(h.slice(2)); nav = 'albums'; }
    else if (h.startsWith('c-')) { chartPage(h.slice(2)); nav = 'charts'; }
    else if (h.startsWith('t-')) { topicPage(h.slice(2)); nav = 'topics'; }
    else notFound();
    document.querySelectorAll('.nav a').forEach(a => a.getAttribute('href') === NAV[nav] ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    window.scrollTo({ top: 0, behavior: 'instant' });
  };
  addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
